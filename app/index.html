<meta charset="utf-8">
<title>Upstream</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Baloo+2:wght@500;600;700&display=swap">
<style>
/* Upstream UI v2 — calm SaaS register (Linear/Vercel), one expressive layer: the funnel.
   Token-driven, three-state theming per the artifact contract. */
:root {
  --bg: #FAFAFB; --surface: #FFFFFF; --surface-2: #F3F3F7; --surface-3: #EDEDF2;
  --border: #ECECF1; --border-strong: #DCDCE4;
  --ink: #17171E; --ink-2: #55555F; --ink-3: #8A8A96;
  --accent: #5B5BD6; --accent-ink: #4646C8; --accent-soft: #EFEFFC; --accent-line: #C9C9F2;
  --und: #1F9D5B; --und-ink: #14713F; --und-bg: #E7F6EE;
  --emg: #C08A0B; --emg-ink: #7D5A05; --emg-bg: #FAF2DA;
  --crd: #D2622B; --crd-ink: #96421B; --crd-bg: #FBEBE0;
  --ovr: #C13A52; --ovr-ink: #92223C; --ovr-bg: #F9E5EA;
  --gold: #B8860B; --quiet: #8A8A96; --quiet-ink: #6B6B78; --quiet-bg: #F2F2F5;
  --good: #1F9D5B; --warn: #C08A0B; --bad: #C13A52;
  --band-good: rgba(31, 157, 91, 0.10); --band-bad: rgba(193, 58, 82, 0.07);
  --chart-grid: #EEEEF3; --chart-axis: #B9B9C4;
  --shadow: 0 1px 2px rgba(23, 23, 30, 0.04), 0 6px 24px rgba(23, 23, 30, 0.05);
  --shadow-lift: 0 2px 4px rgba(23, 23, 30, 0.06), 0 12px 32px rgba(23, 23, 30, 0.09);
  --btn-ink: #FFFFFF;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C0C10; --surface: #14141A; --surface-2: #1A1A22; --surface-3: #22222B;
    --border: #222229; --border-strong: #32323C;
    --ink: #EDEDF3; --ink-2: #A6A6B3; --ink-3: #70707E;
    --accent: #8687F0; --accent-ink: #A7A8F6; --accent-soft: #1D1D31; --accent-line: #3A3A66;
    --und: #34C77E; --und-ink: #83E2B1; --und-bg: rgba(52, 199, 126, 0.12);
    --emg: #E3B23C; --emg-ink: #F0CF83; --emg-bg: rgba(227, 178, 60, 0.12);
    --crd: #E97F4E; --crd-ink: #F4AC87; --crd-bg: rgba(233, 127, 78, 0.12);
    --ovr: #E25C78; --ovr-ink: #F19AAC; --ovr-bg: rgba(226, 92, 120, 0.13);
    --gold: #D9A94B; --quiet: #7B8496; --quiet-ink: #9AA1B0; --quiet-bg: rgba(123, 132, 150, 0.14); --quiet: #7B8496; --quiet-ink: #9AA1B0; --quiet-bg: rgba(123, 132, 150, 0.14);
    --good: #34C77E; --warn: #E3B23C; --bad: #E25C78;
    --band-good: rgba(52, 199, 126, 0.10); --band-bad: rgba(226, 92, 120, 0.08);
    --chart-grid: #1F1F28; --chart-axis: #4A4A58;
    --shadow: none; --shadow-lift: 0 12px 32px rgba(0, 0, 0, 0.5);
    --btn-ink: #0C0C10;
  }
}
:root[data-theme="dark"] {
  --bg: #0C0C10; --surface: #14141A; --surface-2: #1A1A22; --surface-3: #22222B;
  --border: #222229; --border-strong: #32323C;
  --ink: #EDEDF3; --ink-2: #A6A6B3; --ink-3: #70707E;
  --accent: #8687F0; --accent-ink: #A7A8F6; --accent-soft: #1D1D31; --accent-line: #3A3A66;
  --und: #34C77E; --und-ink: #83E2B1; --und-bg: rgba(52, 199, 126, 0.12);
  --emg: #E3B23C; --emg-ink: #F0CF83; --emg-bg: rgba(227, 178, 60, 0.12);
  --crd: #E97F4E; --crd-ink: #F4AC87; --crd-bg: rgba(233, 127, 78, 0.12);
  --ovr: #E25C78; --ovr-ink: #F19AAC; --ovr-bg: rgba(226, 92, 120, 0.13);
  --gold: #D9A94B;
  --good: #34C77E; --warn: #E3B23C; --bad: #E25C78;
  --band-good: rgba(52, 199, 126, 0.10); --band-bad: rgba(226, 92, 120, 0.08);
  --chart-grid: #1F1F28; --chart-axis: #4A4A58;
  --shadow: none; --shadow-lift: 0 12px 32px rgba(0, 0, 0, 0.5);
  --btn-ink: #0C0C10;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scrollbar-gutter: stable; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 14.5px/1.6 Inter, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-feature-settings: "cv11", "ss01";
}
.mono, code { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
a { color: var(--accent-ink); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
button { font: inherit; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ================= shell ================= */
.topbar {
  position: sticky; top: 0; z-index: 40; display: flex; align-items: center; gap: 18px;
  padding: 0 26px; height: 52px;
  background: color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter: blur(12px); border-bottom: 1px solid var(--border);
}
.wordmark { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; letter-spacing: 0.05em;
  font-size: 13.5px; color: var(--ink); }
.wordmark .tick { color: var(--accent); font-size: 11px; }
.nav { display: flex; align-items: center; gap: 2px; }
.nav a { color: var(--ink-3); font-size: 13px; font-weight: 500; padding: 5px 11px; border-radius: 7px; }
.nav a:hover { color: var(--ink); background: var(--surface-2); text-decoration: none; }
.nav a.on { color: var(--ink); background: var(--surface-2); font-weight: 600; }
.topbar .spacer { flex: 1; }
.builtat { font-size: 11px; color: var(--ink-3); }
.healthdot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex: none; }
.tb-chip { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--ink-2);
  border: 1px solid var(--border); border-radius: 999px; padding: 3.5px 11px; background: var(--surface); }
.tb-btn { cursor: pointer; border: none; background: none; color: var(--ink-3); border-radius: 7px;
  padding: 5px 9px; font-size: 12.5px; }
.tb-btn:hover { color: var(--ink); background: var(--surface-2); }
@media (max-width: 760px) {
  .topbar { flex-wrap: wrap; height: auto; padding: 8px 16px; gap: 8px 12px; row-gap: 6px; }
  .nav a { padding: 4px 8px; font-size: 12.5px; }
  .tb-chip { font-size: 11px; padding: 2.5px 8px; }
  main { padding: 8px 16px 70px; }
  .crumbs { padding: 12px 16px 0; }
}

.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; padding: 16px 26px 0;
  max-width: 1160px; margin: 0 auto; font-size: 12.5px; color: var(--ink-3); }
.crumbs a { color: var(--ink-3); }
.crumbs a:hover { color: var(--ink); text-decoration: none; }
.crumbs .here { color: var(--ink); font-weight: 550; }
.crumbs .sep { color: var(--border-strong); }

main { max-width: 1160px; margin: 0 auto; padding: 10px 26px 90px; }
h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.03em; margin: 14px 0 6px; text-wrap: balance; }
.sub { color: var(--ink-2); font-size: 14px; max-width: 76ch; margin: 0 0 10px; }
.seclabel { font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: 0.09em;
  color: var(--ink-3); margin: 44px 0 14px; display: flex; align-items: center; gap: 10px; }
.seclabel::after { content: ""; flex: 1; height: 1px; background: var(--border); }
h3 { font-size: 13.5px; font-weight: 600; margin: 0 0 8px; letter-spacing: -0.01em; }

/* ================= primitives ================= */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  padding: 18px 20px; box-shadow: var(--shadow); }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 650;
  letter-spacing: 0.04em; text-transform: uppercase; border-radius: 6px; padding: 2.5px 7px; white-space: nowrap; }
.chip.neutral { background: var(--surface-2); color: var(--ink-2); }
.chip.accent { background: var(--accent-soft); color: var(--accent-ink); }
.chip.UNDISCOVERED, .chip.INVESTABLE, .chip.DARK, .chip.RIGHT { background: var(--und-bg); color: var(--und-ink); }
.chip.EMERGING, .chip.WATCH, .chip.MIXED { background: var(--emg-bg); color: var(--emg-ink); }
.chip.CROWDED { background: var(--crd-bg); color: var(--crd-ink); }
.chip.OVER_CROWDED, .chip.TOO_LATE, .chip.WRONG { background: var(--ovr-bg); color: var(--ovr-ink); }
.chip.QUIET { background: var(--quiet-bg); color: var(--quiet-ink); }
.chip.stale { background: var(--emg-bg); color: var(--emg-ink); text-transform: none; letter-spacing: 0; }
.chip.verystale { background: var(--ovr-bg); color: var(--ovr-ink); text-transform: none; letter-spacing: 0; }
.chip.tier { background: var(--surface-2); color: var(--ink-3); font-family: "JetBrains Mono", monospace; }
.num { font-family: "JetBrains Mono", monospace; font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); font-size: 12px; }
.small { font-size: 12.5px; color: var(--ink-2); }
.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex: none; }

/* run affordance: primary button + subdued command line */
.runwrap { display: inline-flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.btn-run { cursor: pointer; border: none; border-radius: 9px; padding: 8px 16px;
  font-weight: 600; font-size: 13px; letter-spacing: 0.01em;
  background: var(--accent); color: var(--btn-ink); transition: transform 0.06s, box-shadow 0.12s; }
.btn-run:hover { box-shadow: var(--shadow-lift); transform: translateY(-1px); }
.btn-run:active { transform: translateY(0); }
.btn-run:disabled { opacity: 0.55; cursor: default; transform: none; box-shadow: none; }
.btn-run.q { background: var(--und-bg); color: var(--und-ink); box-shadow: none; cursor: default; }
.cmdline { display: inline-flex; align-items: center; gap: 7px; font-size: 11px; color: var(--ink-3); }
.cmdline code { font-size: 11px; color: var(--ink-3); background: var(--surface-2);
  border-radius: 5px; padding: 1.5px 6px; }
.cmdline button { cursor: pointer; border: none; background: none; color: var(--ink-3);
  font-size: 11px; padding: 1px 4px; border-radius: 4px; }
.cmdline button:hover { color: var(--ink); background: var(--surface-2); }

.toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); z-index: 90;
  background: var(--ink); color: var(--bg); border-radius: 10px; padding: 10px 18px;
  font-size: 13px; box-shadow: var(--shadow-lift); max-width: 88vw; }

table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.07em;
  color: var(--ink-3); font-weight: 650; padding: 8px 12px; border-bottom: 1px solid var(--border); }
td { padding: 11px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
tr:last-child td { border-bottom: none; }
tbody tr:hover td { background: color-mix(in srgb, var(--surface-2) 55%, transparent); }
.tablewrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; box-shadow: var(--shadow); }

/* ================= home ================= */
.hero { display: grid; grid-template-columns: 1.25fr 1fr; gap: 14px; margin-top: 18px; }
@media (max-width: 860px) { .hero { grid-template-columns: 1fr; } }
.today h2 { font-size: 17px; font-weight: 650; letter-spacing: -0.02em; margin: 0 0 4px; }
.today .when { font-size: 12px; color: var(--ink-3); margin-bottom: 12px; }
.delta { list-style: none; margin: 0; padding: 0; }
.delta li { display: flex; gap: 10px; align-items: baseline; padding: 7px 0; font-size: 13.5px;
  border-top: 1px solid var(--border); }
.delta li:first-child { border-top: none; }
.delta .k { flex: none; font-size: 10.5px; font-weight: 650; text-transform: uppercase; letter-spacing: 0.05em;
  border-radius: 5px; padding: 2px 6px; margin-top: 1px; }
.delta .k.new { background: var(--accent-soft); color: var(--accent-ink); }
.delta .k.trip { background: var(--ovr-bg); color: var(--ovr-ink); }
.delta .k.due { background: var(--emg-bg); color: var(--emg-ink); }
.delta .k.upd { background: var(--surface-2); color: var(--ink-2); }
.quiet { display: flex; flex-direction: column; gap: 2px; padding: 10px 0 4px; }
.quiet .big { font-size: 19px; font-weight: 650; letter-spacing: -0.02em; }

.funnelcard { display: flex; flex-direction: column; }
.funnelcard .fc-title { font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: 0.09em; color: var(--ink-3); margin-bottom: 14px; }
.funnel { width: 100%; }
.funnel .stagelabel { font-size: 11px; fill: var(--ink-2); font-weight: 550; }
.funnel .stagecount { font-family: "JetBrains Mono", monospace; font-size: 17px; font-weight: 600; fill: var(--ink); }
.funnel a { cursor: pointer; }
.funnel a:hover .fseg { filter: brightness(1.06); }

.siglist { display: flex; flex-direction: column; }
.sigrow { display: grid; grid-template-columns: 1fr auto; gap: 6px 18px; padding: 16px 20px;
  background: var(--surface); border: 1px solid var(--border); border-top: none; text-decoration: none; color: inherit; }
.sigrow:first-child { border-top: 1px solid var(--border); border-radius: 12px 12px 0 0; }
.sigrow:last-child { border-radius: 0 0 12px 12px; }
.sigrow:only-child { border-radius: 12px; }
.sigrow { cursor: pointer; }
.sigrow:hover { background: color-mix(in srgb, var(--surface-2) 45%, var(--surface)); text-decoration: none; }
.sigrow .t { font-size: 15.5px; font-weight: 600; letter-spacing: -0.015em; margin: 2px 0 3px; }
.sigrow .th { font-size: 13px; color: var(--ink-2); max-width: 68ch;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.sigrow .meta { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--ink-3); }
.sigrow .right { display: flex; flex-direction: column; align-items: flex-end; justify-content: space-between; gap: 8px; }
@media (max-width: 700px) { .sigrow { grid-template-columns: 1fr; } .sigrow .right { flex-direction: row; align-items: center; justify-content: space-between; } }
.gauge { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--ink-3); }
.gauge .track { width: 74px; height: 5px; border-radius: 3px; background: var(--surface-3); overflow: hidden; }
.gauge .track i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }

.sysline { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--ink-3);
  padding: 9px 0; border-top: 1px solid var(--border); }
.sysline:first-of-type { border-top: none; }
.sysline .mono { font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ================= chain ================= */
.pagehead { margin-top: 16px; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 9px; padding: 3px; margin: 20px 0 20px; }
.seg button { cursor: pointer; border: none; background: none; color: var(--ink-3); font-weight: 550;
  font-size: 13px; padding: 6px 15px; border-radius: 7px; }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); font-weight: 600; }

.flow { display: flex; flex-wrap: wrap; align-items: stretch; gap: 10px 6px; }
.fnode { position: relative; cursor: pointer; background: var(--surface); border: 1px solid var(--border);
  border-left-width: 3px; border-radius: 11px; padding: 11px 13px 10px; width: 170px; flex: 0 1 170px;
  box-shadow: var(--shadow); transition: transform 0.07s, box-shadow 0.12s; }
.fnode:hover { transform: translateY(-2px); box-shadow: var(--shadow-lift); }
.fnode.v-UNDISCOVERED { border-left-color: var(--und); }
.fnode.v-EMERGING { border-left-color: var(--emg); }
.fnode.v-CROWDED { border-left-color: var(--crd); }
.fnode.v-OVER_CROWDED { border-left-color: var(--ovr); }
.fnode.v-QUIET { border-left-color: var(--quiet); }
.fnode.v-none { border-left-color: var(--border-strong); border-style: dashed; }
.fnode .pos { font-size: 9.5px; color: var(--ink-3); font-family: "JetBrains Mono", monospace; margin-bottom: 3px; }
.fnode .nm { font-size: 13px; font-weight: 600; line-height: 1.3; letter-spacing: -0.01em; min-height: 34px; }
.fnode .verd { font-size: 9.5px; font-weight: 650; letter-spacing: 0.05em; text-transform: uppercase; margin-top: 7px; }
.fnode .verd.v-UNDISCOVERED { color: var(--und-ink); } .fnode .verd.v-EMERGING { color: var(--emg-ink); }
.fnode .verd.v-CROWDED { color: var(--crd-ink); } .fnode .verd.v-OVER_CROWDED { color: var(--ovr-ink); }
.fnode .verd.v-QUIET { color: var(--quiet-ink); }
.fnode .verd.v-none { color: var(--ink-3); text-transform: none; letter-spacing: 0; }
.triad { display: flex; align-items: flex-end; gap: 3px; height: 22px; position: absolute; right: 12px; bottom: 10px; }
.triad i { display: block; width: 5px; border-radius: 2px 2px 1px 1px; min-height: 2px; }
.triad .ti { background: var(--accent); } .triad .tc { background: var(--crd); } .triad .tv { background: var(--und); }
.fnode .star { position: absolute; top: 8px; right: 10px; color: var(--gold); font-size: 13px; }
.fnode .choke { position: absolute; top: -5px; left: 10px; width: 9px; height: 9px; border-radius: 50%;
  border: 2px solid var(--ovr); background: var(--bg); }
.farrow { align-self: center; color: var(--border-strong); font-size: 14px; padding: 0 1px; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 16px; font-size: 11.5px; color: var(--ink-2); align-items: center; }
.legend .sw { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.legend .tri-demo { display: inline-flex; align-items: flex-end; gap: 2px; height: 12px; margin-right: 6px; vertical-align: -2px; }
.legend .tri-demo i { width: 4px; border-radius: 1px; }

.callout { border: 1px solid var(--border); border-left: 3px solid var(--gold); border-radius: 11px;
  background: var(--surface); padding: 13px 16px; font-size: 13px; color: var(--ink-2); box-shadow: var(--shadow); }
.callout b { color: var(--ink); }

/* drawer */
.scrim { position: fixed; inset: 0; z-index: 49; background: rgba(0, 0, 0, 0.28); }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(460px, 94vw); z-index: 50; background: var(--surface);
  border-left: 1px solid var(--border); box-shadow: -16px 0 48px rgba(0, 0, 0, 0.18); padding: 22px 24px; overflow-y: auto; }
.drawer .x { position: absolute; top: 14px; right: 16px; cursor: pointer; border: none; background: var(--surface-2);
  border-radius: 7px; width: 28px; height: 28px; color: var(--ink-2); font-size: 13px; }
.drawer h2 { font-size: 18px; font-weight: 650; letter-spacing: -0.02em; margin: 10px 0 6px; }
.scorebar { display: grid; grid-template-columns: 100px 1fr 40px; align-items: center; gap: 12px; margin: 8px 0; }
.scorebar .lb { font-size: 12px; color: var(--ink-2); font-weight: 550; }
.scorebar .tk { height: 6px; border-radius: 3px; background: var(--surface-3); overflow: hidden; }
.scorebar .tk i { display: block; height: 100%; border-radius: 3px; }
.scorebar .vl { font-family: "JetBrains Mono", monospace; font-size: 12.5px; text-align: right; }
.evli { font-size: 12.5px; color: var(--ink-2); margin: 6px 0; padding-left: 11px; border-left: 2px solid var(--border); }
.drawer h3 { margin-top: 18px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-3); }

/* scenarios */
.scen { padding: 18px 20px; margin-bottom: 12px; }
.scen .head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.scen .head .t { font-size: 15.5px; font-weight: 650; letter-spacing: -0.015em; }
.scen .p { margin-left: auto; font-family: "JetBrains Mono", monospace; font-size: 21px; font-weight: 600; }
.scen .p small { font-size: 11px; color: var(--ink-3); font-weight: 400; margin-left: 2px; }
.pbar { height: 4px; border-radius: 2px; background: var(--surface-3); overflow: hidden; margin: 10px 0 12px; }
.pbar i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }
.mv { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; border-radius: 7px;
  padding: 3px 9px; margin: 2px 4px 2px 0; background: var(--surface-2); color: var(--ink-2); }
.mv .up { color: var(--good); font-weight: 700; } .mv .down { color: var(--bad); font-weight: 700; }
details { border: none; padding: 0; margin: 10px 0 0; }
summary { cursor: pointer; font-size: 12.5px; font-weight: 550; color: var(--ink-3); list-style: none; }
summary::before { content: "▸ "; font-size: 10px; }
details[open] summary::before { content: "▾ "; }

e at the Maritime Congress of the Russian Far East (Vladivostok, 2026-05-28) to open year-round NSR navigation for 2026-2027; Sovcomflot's Q1 2026 revenue rose 60% YoY to $444M on Arctic/Yamal LNG shuttle operations, and an ice-class LNG carrier completed a rare early-summer NSR transit in June 2026 \u2014 the corridor is compounding on real cargo and revenue, not just diplomatic signaling.","retail_gap":"Western retail shipping/logistics coverage frames the NSR as a China-Russia geopolitical curiosity riding alongside the Red Sea and Panama Canal drought disruption stories; ice-class vessel construction, polar underwriting, and non-Russian Arctic-adjacent infrastructure and shipbuilding plays are absent from mainstream retail shipping narratives.","unmappedness":{"score":80,"rationale":"The climate/geopolitical occurrence has been reported for years and is not obscure, but almost no retail-accessible research maps who builds, insures, finances, or operates the vessels and infrastructure. The most visible operators (Rosatom, Sovcomflot) are sanctioned Russian SOEs, which pushes the actually investable set toward non-obvious names (Korean/Chinese ice-class shipbuilders, reinsurers, Arctic-adjacent non-Russian infrastructure) that a chain build must surface."},"suggested_clock":"COMPOUNDER","horizon_years":[3,5],"evidence":[{"claim":"Northern Sea Route transits hit a record 103 voyages carrying 3.2 million tonnes in 2025, up from 97 voyages in 2024, with China completing 14 container trips (+27%).","source_name":"The Arctic Institute / GlobalViewsWorld Arctic shipping reporting","source_date":"2026-08","tag":"INFERRED"},{"claim":"Rosatom (Rusatom Arctic) and Sovcomflot renewed a pledge at the Maritime Congress of the Russian Far East (Vladivostok) to establish year-round Northern Sea Route navigation starting the 2026-2027 season; Rosatom operates the world's only nuclear-icebreaker fleet (8 vessels in service, 4 under construction).","source_name":"High North News coverage of the Maritime Congress of the Russian Far East","source_date":"2026-05-28","tag":"INFERRED"},{"claim":"Sovcomflot's Q1 2026 revenue rose 60% YoY to $444M with a $94M profit, driven by ice-class LNG tanker service to the Yamal LNG project; the icebreaking LNG carrier Christophe de Margerie completed a rare early-summer NSR transit (Utrenniy terminal to the Bering Strait) in 13 days, departing 2026-05-26.","source_name":"gCaptain Sovcomflot Q1 2026 results and Arctic LNG transit reporting","source_date":"2026-05-26","tag":"INFERRED"}],"status":"NEW","chain_id":null,"review_by":"2026-11-29","notes":[],"confidence_audit":{"verified":0,"inferred":3,"speculative":0,"null":0},"changelog":[{"ts":"2026-08-29T00:00:00Z","by":"routine","change":"new signal card from weekday radar scan (MACRO lane)","prior":null}]},{"id":"SIG-20260829-02","created_at":"2026-08-29","updated_at":"2026-08-29","occurrence":{"kind":"UNDERWAY","anchor_date":"2025-07-01","window":"GLP-1 fill-finish/delivery-device capacity crunch intensifying since 2025, with the tightest dated evidence (BD $110M expansion, West/Stevanato guidance raises) from Jan-Jul 2026","label":"GLP-1 fill-finish/device capacity crunch"},"lane":"INDUSTRY","title":"GLP-1's picks-and-shovels: fill-finish and delivery-device capacity, not the molecules","thesis":"The GLP-1 obesity/diabetes story is retail-saturated at the molecule layer (Novo Nordisk, Eli Lilly), but the sterile fill-finish and delivery-device layer beneath it \u2014 prefilled syringes, glass and polymer cartridges, high-speed aseptic filling lines \u2014 is capacity-constrained for multiple years and structurally under-covered by retail, even as its public suppliers post accelerating GLP-1-linked growth and guidance raises.","why_now":"West Pharmaceutical's Q1 2026 organic revenue grew 15% and it raised FY2026 guidance (EPS to $8.85-$9.05, sales to $3.345-3.380B) on GLP-1 and High Value Products strength; Stevanato Group's Q1 2026 revenue grew ~10% constant f Japanese and Chinese makers with structurally limited scale-up \u2014 is barely represented in retail portfolios despite fresh, quantifiable order-book evidence that it is the binding constraint.","why_now":"Harmonic-drive lead times run 26+ weeks and the components are described as structurally harder to scale than electronics because of precision-manufacturing limits; Harmonic Drive Systems (Tokyo: 6324) reported FY2026/3 full-year orders up 16.2% to \u00a561.6B with backlog up 13.6% to \u00a521.9B, explicitly citing industrial-robot, semiconductor-equipment, and emerging AI-robot demand, and guided FY2027/3 operating income to more than double (+141.5%); Chinese challenger Leaderdrive grew FY2025 revenue 47.3% to \u00a5571M as humanoid programs scale procurement.","retail_gap":"Retail humanoid exposure runs almost entirely through Tesla (Optimus) and thematic robotics ETFs holding household names; the actual gating suppliers (Harmonic Drive Systems, Nabtesco, Leaderdrive) sit at low single-digit weights inside niche thematic funds (e.g., ~2% each in KOID) and are essentially absent from mainstream retail discussion despite being named the structural bottleneck by industry researchers.","unmappedness":{"score":65,"rationale":"The humanoid-robot theme itself is fully discovered and already anchors method \u00a73's 85+ 'GPU-class retail story' band \u2014 not unmapped. The actuator/gearbox link specifically is thinly held, now backed by fresh, dated order-book data showing it tightening in real time, and has not yet become a retail talking point: a genuine crowdedness gap sitting inside an otherwise crowded chain."},"suggested_clock":"COMPOUNDER","horizon_years":[2,5],"evidence":[{"claim":"Figure's humanoids have contributed to production of 30,000+ vehicles at BMW's Spartanburg plant running ten-hour shifts five days a week; Tesla has 1,000+ Optimus Gen 3 units working across its facilities on battery assembly and cable routing; Unitree shipped roughly 5,500 huma r / Strait of Hormuz closure"},"lane":"MACRO","title":"Iran war at six months: the Hormuz-closure chain beyond the oil-price headline","thesis":"The US-Israel war on Iran (launched 2026-02-28) triggered Iran's closure of the Strait of Hormuz \u2014 previously ~25% of world seaborne oil and ~20% of global LNG \u2014 producing what analysts call the largest, most durable oil-market disruption in memory. Six months on, the war and the oil price are the most heavily covered macro story on earth, but the chain beneath it \u2014 Cape-of-Good-Hope tanker rerouting economics, marine war-risk (re)insurance repricing, a Somali-piracy resurgence exploiting stretched naval patrols, and a broader Gulf-security-architecture reshuffle \u2014 sits mostly in trade press, not mainstream financial coverage.","why_now":"At the six-month mark (per Washington Post/CSIS reporting, 2026-08-27) there is still no off-ramp; war-risk marine insurance premiums for Hormuz/Persian Gulf transits have spiked >1,000% (from ~0.15-0.25% to 7.5-10% of vessel value per voyage) and the Joint War Committee widened its war-risk zones in March 2026 to cover Bahrain, Djibouti, Kuwait, Oman, Qatar and the Somali/Pakistani coastlines; Somali pirates hijacked three tankers (MT Honour 25, MT Eureka, MT Asana) between April-July 2026 as ships reroute around Africa and naval patrols are stretched thin across two simultaneous shipping crises (Hormuz + the pre-existing Red Sea/Houthi situation).","retail_gap":"Mainstream and retail coverage tracks the war itself and the headline oil price; the tanker-rerouting / marine-war-risk-insurance / piracy-security layer beneath it is covered mainly in energy and insurance trade press (OilPrice, Insurance Business, Insurance Journal, TFTC), rarely reaching general financial media or retail portfolios.","unmappedness":{"score":75,"rationale":"The occurrence is maximally known \u2014 a live war and a closed strait have been the dominant headline for six months, the opposite of <script>
/* Upstream SPA v2 — vanilla JS over window.UPSTREAM_DATA. Hash-routed, no external libs. */
(function () {
  "use strict";
  var D = window.UPSTREAM_DATA || {};
  var app = document.getElementById("app");
  var TODAY = (D.built_at || new Date().toISOString()).slice(0, 10);

  /* ---------------- helpers ---------------- */
  function esc(s) {
    if (s === null || s === undefined) return "";
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function byId(list, id) { for (var i = 0; i < (list || []).length; i++) if (list[i].id === id) return list[i]; return null; }
  function daysBetween(a, b) { return Math.round((new Date(b) - new Date(a)) / 86400000); }
  function staleChip(asOf) {
    if (!asOf) return "";
    var d = daysBetween(asOf, TODAY);
    if (d > 90) return '<span class="chip verystale">stale · ' + esc(asOf) + "</span>";
    if (d > 30) return '<span class="chip stale">stale · ' + esc(asOf) + "</span>";
    return "";
  }
  function chip(text, cls) { return '<span class="chip ' + esc(cls || "neutral") + '">' + esc(text) + "</span>"; }
  function tierChip(t) { return t ? '<span class="chip tier">' + esc(t) + "</span>" : ""; }
  function verdColor(v) { return { QUIET: "var(--quiet)", UNDISCOVERED: "var(--und)", EMERGING: "var(--emg)", CROWDED: "var(--crd)", OVER_CROWDED: "var(--ovr)" }[v] || "var(--border-strong)"; }
  function marketFor(t) { return (D.market || {})[String(t).replace(/\./g, "-")] || (D.market || {})[t] || null; }
  function fmtMoney(x) { return typeof x === "number" ? x.toLocaleString("en-US", { maximumFractionDigits: 2 }) : esc(x); }
  function seclabel(t) { return '<div class="seclabel">' + esc(t) + "</div>"; }

  /* ---------------- click queue (artifact capability) ----------------
     A Run click publishes a new version of this page with the command queued
     in the #upstream-queue block. Any live Claude session watching the
     artifact is notified, executes the command against the repo, and
     republishes the page with the results baked in. Where queueing is
     unavailable (local preview, read-only viewer) the button degrades to a
     copy affordance automatically. */
  var QUEUE = { v: 1, queue: [] };
  try { QUEUE = JSON.parse(document.getElementById("upstream-queue").textContent) || QUEUE; } catch (e) {}
  var QSTATE = { readonly: false, busy: false };
  var SCRIPT_END = "</scr" + "ipt>";
  function canQueue() { return !!(window.claude && typeof window.claude.use === "function") && !QSTATE.readonly; }
  function isQueued(cmd) { return (QUEUE.queue || []).some(function (q) { return q.cmd === cmd; }); }
  function toast(msg, ms) {
    var t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, ms || 5600);
  }
  function fetchSelfSource() {
    function ok(r) { return r.ok ? r.text() : Promise.reject(new Error("HTTP " + r.status)); }
    return fetch("index.html", { cache: "no-store" }).then(ok)
      .catch(function () { return fetch(location.href.split("#")[0], { cache: "no-store" }).then(ok); })
      .then(function (src) {
        if (src.indexOf('id="upstream-queue"') < 0) throw new Error("queue block not found in source");
        return src;
      });
  }
  function replaceQueueBlock(src, queueObj) {
    var open = src.indexOf('id="upstream-queue"');
    var start = src.indexOf(">", open) + 1;
    var end = src.indexOf(SCRIPT_END, start);
    return src.slice(0, start) + JSON.stringify(queueObj).replace(/<\//g, "<\\/") + src.slice(end);
  }
  function enqueue(cmd, btn) {
    if (QSTATE.busy) return;
    QSTATE.busy = true;
    if (btn) { btn.disabled = true; btn.textContent = "Queuing…"; }
    var fail = function (msg, permanent) {
      QSTATE.busy = false;
      if (permanent) QSTATE.readonly = true;
      toast(msg, 6500);
      route();
    };
    if (!canQueue()) return fail("Queueing unavailable in this view — copy the command into a Claude session instead.", false);
    window.claude.use("artifact").then(function (ns) {
      if (!ns) return fail("This view cannot queue — copy the command into a Claude session instead.", true);
      return fetchSelfSource().then(function (src) {
        var cur = { v: 1, queue: [] };
        try {
          var o = src.indexOf('id="upstream-queue"');
          var s = src.indexOf(">", o) + 1;
          cur = JSON.parse(src.slice(s, src.indexOf(SCRIPT_END, s))) || cur;
        } catch (e) {}
        if ((cur.queue || []).some(function (q) { return q.cmd === cmd; })) {
          QSTATE.busy = false; QUEUE = cur; toast("Already queued: " + cmd); route(); return;
        }
        cur.queue = (cur.queue || []).concat([{ id: "q-" + Date.now(), cmd: cmd, ts: new Date().toISOString() }]);
        try { sessionStorage.setItem("upstream.justQueued", cmd); } catch (e) {}
        return ns.publish(replaceQueueBlock(src, cur)).catch(function (err) {
          try { sessionStorage.removeItem("upstream.justQueued"); } catch (e) {}
          var code = (err && err.code) || "upstream_error";
          if (code === "conflict") { QSTATE.busy = false; return; } // view reloads to the winner; re-click there
          if (code === "not_writer" || code === "not_granted" || code === "not_declared" ||
              code === "capability_disabled" || code === "capability_removed")
            return fail("This view is read-only — buttons switched to copy mode.", true);
          if (code === "rate_limited") return fail("Queueing too fast — wait a minute and try again.", false);
          return fail("Queueing failed (" + code + ") — use copy this time.", false);
        });
      });
    }).catch(function () { fail("Queueing unavailable — use copy instead.", false); });
  }
  var RUN_LABELS = [
    [/^run chain /, "Build chain"], [/^run heat /, "Score heat map"], [/^run scenarios /, "Write scenarios"],
    [/^run screen /, "Screen stocks"], [/^run deepdive /, "Run deep dive"], [/^run redteam /, "Red-team it"],
    [/^request data /, "Fetch data"], [/^refresh /, "Update"], [/^run radar/, "Run radar"], [/^run digest/, "Build digest"],
  ];
  function runLabel(cmd) {
    for (var i = 0; i < RUN_LABELS.length; i++) if (RUN_LABELS[i][0].test(cmd)) return RUN_LABELS[i][1];
    return "Run";
  }
  function cmdline(cmd) {
    return '<span class="cmdline"><code>' + esc(cmd) + '</code><button data-copy="' + esc(cmd) + '" title="copy command">copy</button></span>';
  }
  function runButton(cmd, caption, opts) {
    opts = opts || {};
    if (isQueued(cmd)) {
      if (opts.compact) return '<button class="btn-run q" disabled>Queued ✓</button>';
      return '<div class="runwrap"><button class="btn-run q" disabled>Queued ✓</button>' +
        '<span class="cmdline">waiting for a live Claude session · ' + cmdline(cmd) + "</span></div>";
    }
    var btn = canQueue()
      ? '<button class="btn-run" data-run="' + esc(cmd) + '">' + esc(runLabel(cmd)) + "</button>"
      : '<button class="btn-run" data-copyrun="' + esc(cmd) + '">' + esc(runLabel(cmd)) + (opts.compact ? "" : " — copy") + "</button>";
    if (opts.compact) return btn;
    return '<div class="runwrap">' + btn +
      '<span class="cmdline">' + esc(caption || (canQueue() ? "runs in a live Claude session; results land on this page" : "copies the command — paste into a Claude session on this repo")) +
      " · " + cmdline(cmd) + "</span></div>";
  }

  /* ---------------- shell ---------------- */
  function pendingCount() {
    return ((D.requests || {}).requests || []).filter(function (x) { return x.status === "PENDING"; }).length;
  }
  function failedCount() {
    return ((D.requests || {}).requests || []).filter(function (x) { return x.status === "FAILED"; }).length;
  }
  function healthState() {
    if (failedCount() > 0) return ["var(--bad)", failedCount() + " data request(s) FAILED — see data/requests.json"];
    var rs = ((D.health || {}).sessions || {}).routine_status || {};
    if (rs.radar === "LIVE") {
      var lastRadar = null;
      (D.ledger || []).forEach(function (l) { if (l.indexOf("| RADAR") > -1) lastRadar = l.slice(0, 10); });
      if (lastRadar && daysBetween(lastRadar, TODAY) > 4) return ["var(--bad)", "radar silent since " + lastRadar];
    }
    if (pendingCount() > 0) return ["var(--warn)", pendingCount() + " data request(s) pending"];
    return ["var(--good)", "all loops quiet"];
  }
  function navHrefChains() {
    return (D.chains || []).length === 1 ? "#/chain/" + D.chains[0].id : "#/chains";
  }
  function topbar(active) {
    var hs = healthState();
    var q = (QUEUE.queue || []).length;
    function na(href, label, key) {
      return '<a href="' + href + '" class="' + (active === key ? "on" : "") + '">' + label + "</a>";
    }
    return '<div class="topbar">' +
      '<a href="#/" class="wordmark"><span class="tick">▲</span>UPSTREAM</a>' +
      '<nav class="nav">' +
      na("#/", "Cortex", "cortex") +
      na("#/radar", "Radar", "radar") +
      na(navHrefChains(), (D.chains || []).length === 1 ? "Chain" : "Chains", "chain") +
      na("#/book", "Book", "book") +
      na("#/shadow", "Shadow", "shadow") +
      "</nav>" +
      '<span class="spacer"></span>' +
      (q ? '<span class="tb-chip" title="queued commands awaiting a live Claude session"><span class="healthdot" style="background:var(--accent)"></span>' + q + " queued</span>" : "") +
      (pendingCount() ? '<span class="tb-chip"><span class="healthdot" style="background:var(--warn)"></span>' + pendingCount() + " fetching</span>" : "") +
      '<span class="tb-chip" title="' + esc(hs[1]) + '"><span class="healthdot" style="background:' + hs[0] + '"></span>health</span>' +
      '<button class="tb-btn" id="themeBtn" title="theme">◐</button>' +
      "</div>";
  }
  function crumbs(parts) {
    var h = '<div class="crumbs"><a href="#/radar">Radar</a>';
    parts.forEach(function (p, i) {
      h += '<span class="sep">/</span>';
      if (p.href && i < parts.length - 1) h += '<a href="' + p.href + '">' + esc(p.label) + "</a>";
      else h += '<span class="here">' + esc(p.label) + "</span>";
    });
    return h + "</div>";
  }
  function footer() {
    return '<div class="footer">Upstream is a private research tool for its two users. Verdicts, zones, and levels are analytical outputs from public data with stated methods and gaps — not investment advice. Built ' + esc(D.built_at || "?") + " · canonical copy: <span class='mono'>app/index.html</span> in the repo.</div>";
  }

  /* ---------------- what changed ---------------- */
  function lastVisit() { try { return localStorage.getItem("upstream.lastVisit"); } catch (e) { return null; } }
  function stampVisit() { try { localStorage.setItem("upstream.lastVisit", new Date().toISOString()); } catch (e) {} }
  function deltaItems() {
    var since = lastVisit();
    var items = [];
    (D.signals || []).forEach(function (s) {
      if (!since || (s.created_at && s.created_at > since.slice(0, 10)))
        items.push({ k: "new", h: "Signal: <a href='#/signal/" + s.id + "'>" + esc(s.title) + "</a>" });
    });
    (D.stocks || []).forEach(function (st) {
      (st.changelog || []).forEach(function (c) {
        if (since && c.ts > since) items.push({ k: "upd", h: "<a href='#/stock/" + st.ticker + "/" + st.chain_id + "'>" + esc(st.ticker) + "</a> — " + esc(c.change) });
      });
      if (st.review_by && st.review_by <= TODAY && st.status !== "ARCHIVED")
        items.push({ k: "due", h: "Review due: <a href='#/stock/" + st.ticker + "/" + st.chain_id + "'>" + esc(st.ticker) + "</a> (by " + esc(st.review_by) + ")" });
    });
    (D.chains || []).forEach(function (c) {
      (c.scenarios || []).forEach(function (sc) {
        (sc.leading_indicators || []).forEach(function (ind) {
          if (ind.tripped_at) items.push({ k: "trip", h: esc(ind.indicator) + " → <a href='#/chain/" + c.id + "/scen'>" + esc(sc.id + " · " + sc.title) + "</a>" });
        });
      });
    });
    ((D.indicators || {}).trips || []).forEach(function (t) {
      if (!since || t.tripped_at >= since.slice(0, 10))
        items.push({ k: "trip", h: esc(t.indicator) + " (" + esc(t.ticker) + " " + esc(t.op) + " " + esc(t.level) + ", seen " + esc(t.seen) + ") → <a href='#/chain/" + t.chain + "/scen'>" + esc(t.chain + " " + t.scenario) + "</a>" });
    });
    return { since: since, items: items };
  }

  /* ---------------- home ---------------- */
  function funnelCard() {
    var nSig = (D.signals || []).filter(function (s) { return s.status !== "DISMISSED" && s.status !== "EXPIRED"; }).length;
    var nCh = (D.chains || []).length;
    var nScen = 0, nScr = (D.screens || []).length;
    (D.chains || []).forEach(function (c) { nScen += (c.scenarios || []).length; });
    var nVer = (D.stocks || []).length;
    var one = (D.chains || [])[0];
    var stages = [
      { n: nSig, l: "Signals", href: "#/radar" },
      { n: nCh, l: nCh === 1 ? "Chain" : "Chains", href: navHrefChains() },
      { n: nScen, l: "Scenarios", href: one ? "#/chain/" + one.id + "/scen" : "#/radar" },
      { n: nScr, l: "Screens", href: nScr && one ? "#/screen/" + D.screens[0].chain_id + "/" + D.screens[0].scenario_id : "#/radar" },
      { n: nVer, l: "Verdicts", href: nVer ? "#/stock/" + D.stocks[0].ticker + "/" + D.stocks[0].chain_id : "#/radar" },
    ];
    var W = 520, H = 132, n = stages.length, gap = 14, segW = (W - gap * (n - 1)) / n;
    var s = '<svg class="funnel" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="pipeline">';
    stages.forEach(function (st, i) {
      var x = i * (segW + gap);
      var op = 1 - i * 0.17;
      s += '<a href="' + st.href + '">';
      s += '<rect class="fseg" x="' + x + '" y="46" width="' + segW + '" height="46" rx="10" fill="var(--accent)" opacity="' + op.toFixed(2) + '"/>';
      s += '<text class="stagecount" x="' + (x + segW / 2) + '" y="30" text-anchor="middle">' + st.n + "</text>";
      s += '<text class="stagelabel" x="' + (x + segW / 2) + '" y="112" text-anchor="middle">' + esc(st.l) + "</text>";
      s += "</a>";
      if (i < n - 1) s += '<path d="M' + (x + segW + 2.5) + ' 63 l8 6 -8 6" fill="none" stroke="var(--border-strong)" stroke-width="1.6" stroke-linecap="round"/>';
    });
    s += "</svg>";
    return '<div class="card funnelcard"><div class="fc-title">The funnel — click a stage</div>' + s +
      '<div class="muted" style="margin-top:10px">Lazy by design: each stage runs only when someone asks, and everything ever run is saved here.</div></div>';
  }
  function todayCard() {

  /* Scout panel: the radar grading its own intake. Every figure prints its denominator,
     so "0 misses" can be told apart from "nothing was checked". Source: data/radar/scout-log.json. */
  function scoutCard() {
    var sc = D.scout;
    if (!sc || !sc.calibration) return "";
    var c = sc.calibration, cv = c.conversion || {}, dn = c.denominators || {}, fd = c.funnel_depth || {};
    var lat = c.latency || [], unm = c.latency_unmatched || [];
    var days = lat.map(function (l) { return l.days_late; }).filter(function (n) { return typeof n === "number"; }).sort(function (a, b) { return a - b; });
    var med = days.length ? days[Math.floor(days.length / 2)] : null;
    var dd = c.death_outcomes || {};
    var hardened = (sc.proposed_rules || []).filter(function (r) { return r.status === "HARDENED"; });
    var proposed = (sc.proposed_rules || []).filter(function (r) { return r.status === "PROPOSED"; });
    var esc_ = (sc.notes || []).filter(function (n) { return /^ESCALATION/.test(String(n.text || "")); });

    function stat(v, label) {
      return '<div class="scstat"><div class="scnum">' + esc(v) + '</div><div class="muted">' + esc(label) + "</div></div>";
    }
    return seclabel("Scout — how good this intake has been") +
      '<div class="statgrid">' +
      '<div class="card"><h3>Conversion</h3><div class="scrow">' +
      stat(cv.promoted + "/" + cv.candidates_triaged, "candidates promoted") +
      stat(fd.reached_chain + "/" + fd.signals_total, "signals chained") +
      stat(fd.in_money_corner_chain + "/" + fd.signals_total, "reached a money corner") +
      "</div><div class='small'>" + esc(cv.ambient) + " AMBIENT still open · " +
      esc(dn.feed_items_examined) + " feed items examined this run</div></div>" +

      '<div class="card"><h3>Latency</h3><div class="scrow">' +
      stat(med === null ? "n/a" : med + "d", days.length >= 3 ? "median days late" : "days late (n=" + days.length + ", not a median)") +
      stat(lat.length + "/" + dn.signals_examined, "measurable") +
      "</div><div class='small'>" +
      (unm.length ? esc(unm.length) + " signal(s) unmeasurable: " + esc(unm[0].reason) +
        ". Latency is the gap between an occurrence first appearing in the feed store and radar writing the card."
        : "Every signal is joined back to its first feed appearance.") +
      "</div></div>" +

      '<div class="card"><h3>My misses</h3><div class="scrow">' +
      stat((dd.signals_new_past_review_by || []).length + "/" + dn.signals_examined, "past review_by") +
      stat((dd.candidates_past_expiry || []).length + "/" + cv.ambient, "past 45d expiry") +
      stat(dn.calendar_examined ? (dd.calendar_passed_unpromoted || []).length + "/" + dn.calendar_examined : "—", "calendar passed") +
      "</div><div class='small'>False positives are counted against the radar, not hidden." +
      (dn.calendar_examined ? "" : " The forward calendar is empty, so that leg checked nothing: a scope boundary, not a clean result.") +
      "</div></div>" +

      '<div class="card"><h3>Taste rules</h3>' +
      (hardened.length ? hardened.map(function (r) {
        return '<div class="evli">' + chip(r.origin) + " <b>" + esc(r.id) + "</b> " + esc(r.pattern) + "</div>";
      }).join("") : "<div class='small'>No rules yet.</div>") +
      (proposed.length ? "<div class='muted' style='margin-top:8px'>" + esc(proposed.length) +
        " proposed, waiting on a second occurrence</div>" : "") +
      "</div>" + "</div>" +
      esc_.map(function (n) {
        return '<div class="sysline"><span class="healthdot" style="background:var(--crd)"></span>' +
          esc(n.text) + "</div>";
      }).join("");
  }

  /* Map quality: the cartographer grading his own maps. Every figure prints its denominator,
     so "0 findings" can be told apart from "nothing examined". Source: data/chains/_map-log.json. */
  function mapStat(v, label) {
    return '<div class="scstat"><div class="scnum">' + esc(v) + '</div><div class="muted">' + esc(label) + "</div></div>";
  }
  function mapCard(chainId) {
    var ml = D.map;
    if (!ml || !ml.calibration) return "";
    var cal = ml.calibration, per = cal.per_chain || {}, dn = cal.denominators || {};
    var arch = (ml.archetypes || []).filter(function (a) { return a.status === "HARDENED"; });
    if (chainId) {
      var v = per[chainId];
      if (!v) return "";
      var st = v.structure || {};
      var findings = [];
      if ((st.orphans || []).length) findings.push(st.orphans.length + " orphan link(s)");
      if ((st.one_way_edges || []).length) findings.push(st.one_way_edges.length + " one-way edge(s)");
      if ((st.wrong_direction_edges || []).length) findings.push(st.wrong_direction_edges.length + " edge(s) against the direction rule");
      if ((st.verdict_mismatches || []).length) findings.push(st.verdict_mismatches.length + " verdict(s) disagreeing with their scores");
      if ((st.thin_choke_points || []).length) findings.push("thin choke point: " + st.thin_choke_points.join(", "));
      if ((st.links_without_tickers || []).length) findings.push(st.links_without_tickers.length + " link(s) with no tickers");
      return '<div class="card mapq">' +
        '<div class="row" style="justify-content:space-between;align-items:flex-start">' +
        "<h3>Map quality</h3>" +
        '<span class="muted">' + esc(st.links_without_evidence ? st.links_without_evidence.length : 0) +
        "/" + esc(v.links) + " links uncited</span></div>" +
        '<div class="scrow">' +
        mapStat(v.yielded_a_name + "/" + v.links, "links that produced a name") +
        mapStat(v.scored + "/" + v.links, "scored") +
        mapStat((st.non_us_ticker_share == null ? "n/a" : Math.round(st.non_us_ticker_share * 100) + "%"), "non-US tickers") +
        mapStat((v.money_corner_links || []).length, "money corner") +
        "</div>" +
        "<div class='small'>" +
        (findings.length ? "Findings: " + esc(findings.join(" · ")) : "No structural findings across " +
          esc(v.links) + " links and " + esc(st.tickers_examined) + " tickers examined.") +
        ((v.dead_links || []).length
          ? " Links that have never produced a name: " + esc(v.dead_links.join(", ")) + "."
          : "") +
        "</div></div>";
    }
    // global view (#/chains)
    var ly = cal.link_yield || {}, dep = ly.depth || {};
    return seclabel("Atlas — how good these maps have been") +
      '<div class="statgrid">' +
      '<div class="card"><h3>Link yield</h3><div class="scrow">' +
      mapStat(ly.yielded_a_name + "/" + ly.links_total, "produced a name") +
      mapStat((dep.DIVED || 0) + "/" + ly.links_total, "reached a dive") +
      mapStat(ly.money_corner_links, "money corner") +
      "</div><div class='small'>Joined on link_id only. " + esc(ly.note || "") + "</div></div>" +
      '<div class="card"><h3>Depth</h3><div class="scrow">' +
      mapStat(dep.MAPPED || 0, "mapped only") + mapStat(dep.SCORED || 0, "scored") +
      mapStat(dep.SCREENED || 0, "screened") + mapStat(dep.DIVED || 0, "dived") +
      "</div><div class='small'>" + esc(dn.chains_examined) + " chains, " + esc(dn.links_examined) +
      " links, " + esc(dn.edges_examined) + " edges, " + esc(dn.screen_rows_examined) +
      " screen rows examined.</div></div>" +
      '<div class="card"><h3>Archetypes</h3>' +
      (arch.length ? arch.map(function (a) {
        return '<div class="evli">' + chip(a.origin) + " <b>" + esc(a.id) + "</b> " + esc(a.pattern) +
          ' <span class="muted">(' + esc(a.occurrences) + " chain" + (a.occurrences === 1 ? "" : "s") + ")</span></div>";
      }).join("") : "<div class='small'>None yet.</div>") + "</div>" +
      "</div>" +
      (ml.notes || []).filter(function (n) { return /^ESCALATION/.test(String(n.text || "")); })
        .map(function (n) {
          return '<div class="sysline"><span class="healthdot" style="background:var(--crd)"></span>' + esc(n.text) + "</div>";
        }).join("");
  }

  /* ---------------- chain ---------------- */
  var chainTab = "flow";

      "<h1>" + esc(c.title) + "</h1><p class='sub'>" + esc(subtitle) + "</p></div>" +

  function sigTitle(id) { var s = byId(D.signals, id); return s ? s.title : id; }
  function triad(h) {

        '<div class="verd ' + (hv ? "v-" + hv : "v-none") + '">' + (hv ? esc(hv.replace("_", " ")) : "unscored") + "</div>" +
        triad(l.heat) + "</div>";

    });
    h += "</div>";

      '<span><span class="tri-demo"><i style="height:11px;background:var(--accent)"></i><i style="height:7px;background:var(--crd)"></i><i style="height:9px;background:var(--und)"></i></span>impact · crowdedness · capture</span>' +

  }
  function scoreBar(name, obj, colorVar) {

  function linkName(c, id) { var l = byId(c.links, id); return l ? l.name : id; }
  function shortName(n) { return n.split("(")[0].replace(" & ", " · ").trim(); }
  function heatTab(c, links, scored) {
    if (!scored.length) return '<div class="emptystate">No links scored yet.<div class="runwrap">' + runButton("run heat " + c.id) + "</div></div>";
    var W = 940, H = 560, P = { l: 64, r: 40, t: 34, b: 52 };
    var iw = W - P.l - P.r, ih = H - P.t - P.b;
    function X(v) { return P.l + (v / 100) * iw; }
    function Y(cr) { return P.t + (cr / 100) * ih; } // crowdedness 0 at TOP → money corner top-right
    var s = '<div class="card"><div class="chartwrap"><svg viewBox="0 0 ' + W + " " + H + '" width="100%" style="max-width:' + W + 'px" role="img" aria-label="Impact vs crowdedness map">';
    s += '<rect x="' + X(60) + '" y="' + Y(0) + '" width="' + (X(100) - X(60)) + '" height="' + (Y(40) - Y(0)) + '" fill="var(--band-good)" rx="10"/>';
    s += '<text x="' + X(80) + '" y="' + (Y(0) + 20) + '" text-anchor="middle" font-size="11" font-weight="650" fill="var(--und)" letter-spacing="1">★ MONEY CORNER</text>';
    [0, 25, 50, 75, 100].forEach(function (v) {
      s += '<line x1="' + X(v) + '" y1="' + P.t + '" x2="' + X(v) + '" y2="' + (H - P.b) + '" stroke="var(--chart-grid)"/>';
      s += '<line x1="' + P.l + '" y1="' + Y(v) + '" x2="' + (W - P.r) + '" y2="' + Y(v) + '" stroke="var(--chart-grid)"/>';
      s += '<text x="' + X(v) + '" y="' + (H - P.b + 20) + '" text-anchor="middle" font-size="10" class="mono-t" fill="var(--chart-axis)">' + v + "</text>";
      s += '<text x="' + (P.l - 12) + '" y="' + (Y(v) + 3) + '" text-anchor="end" font-size="10" class="mono-t" fill="var(--chart-axis)">' + v + "</text>";
    });
    s += '<line x1="' + X(60) + '" y1="' + P.t + '" x2="' + X(60) + '" y2="' + (H - P.b) + '" stroke="var(--chart-axis)" stroke-dasharray="3 5"/>';
    s += '<line x1="' + P.l + '" y1="' + Y(40) + '" x2="' + (W - P.r) + '" y2="' + Y(40) + '" stroke="var(--chart-axis)" stroke-dasharray="3 5"/>';
    s += '<text x="' + (P.l + iw / 2) + '" y="' + (H - 10) + '" text-anchor="middle" font-size="11.5" font-weight="550">Impact →</text>';
    s += '<text transform="rotate(-90)" x="' + (-(P.t + ih / 2)) + '" y="18" text-anchor="middle" font-size="11.5" font-weight="550">Quieter →</text>';
    var placed = [];
    function labelSpot(x, yCands, name) {
      var w = name.length * 5.6;
      for (var ci = 0; ci < yCands.length; ci++) {
        var y = yCands[ci];
        if (y < P.t + 10 || y > H - P.b - 4) continue;
        var hit = placed.some(function (p) { return Math.abs(p.y - y) < 13 && (Math.abs(p.x - x) < (p.w + w) / 2 + 6); });
        if (!hit) { placed.push({ x: x, y: y, w: w }); return y; }
      }
      var y2 = yCands[yCands.length - 1];
      placed.push({ x: x, y: y2, w: w });
      return y2;
    }
    scored.slice().sort(function (a, b) { return a.heat.crowdedness.score - b.heat.crowdedness.score; }).forEach(function (l) {
      var im = l.heat.impact ? l.heat.impact.score : null, cr = l.heat.crowdedness.score, cp = l.heat.capture ? l.heat.capture.score : 40;
      if (im == null) return;
      var r = 6 + (cp || 0) / 10;
      var nm = shortName(l.name);
      var ly = labelSpot(X(im), [Y(cr) - r - 8, Y(cr) + r + 14, Y(cr) - r - 22, Y(cr) + r + 28, Y(cr) - r - 36], nm);
      s += '<circle cx="' + X(im) + '" cy="' + Y(cr) + '" r="' + r.toFixed(1) + '" fill="' + verdColor(l.heat.verdict) + '" fill-opacity="0.85" stroke="var(--surface)" stroke-width="2"><title>' + esc(l.name) + " — impact " + im + ", crowdedness " + cr + ", capture " + cp + "</title></circle>";
      s += '<text x="' + X(im) + '" y="' + ly + '" text-anchor="middle" font-size="10.5" font-weight="600" fill="var(--ink)">' + esc(nm) + "</text>";
    });
    s += "</svg></div>";
    s += '<div class="legend"><span>dot size = value capture</span>' +
      [["Undiscovered", "--und"], ["Emerging", "--emg"], ["Crowded", "--crd"], ["Over-crowded", "--ovr"]].map(function (v) {
        return '<span><span class="sw" style="background:var(' + v[1] + ')"></span>' + v[0] + "</span>";
      }).join("") + "</div></div>";
    var un = links.filter(function (l) { return !l.heat || !l.heat.crowdedness || l.heat.crowdedness.score == null; });
    if (un.length) s += '<div class="muted" style="margin-top:10px">Not scored: ' + un.map(function (l) { return esc(l.name); }).join(", ") + "</div>";
    var mc = links.filter(function (l) { return l.heat && l.heat.money_corner; });
    s += '<div class="callout" style="margin-top:14px">' +
      (mc.length ? "<b>★ " + mc.map(function (l) { return esc(l.name); }).join(" · ") + "</b> clears all three bars (impact ≥ 60, crowdedness ≤ 40, capture ≥ 60). " :
        "<b>No money corner yet</b> — no link clears impact ≥ 60, crowdedness ≤ 40, capture ≥ 60 together. ") +
      "Quiet links with <b>small dots</b> are the trap: ignored because capture is capped, not because the market missed them.</div>";
    return s;
  }

  // --- analyst surfaces (2026-08-29). Every number here is READ from the dive or from

  function priceChart(mk, st) {
    if (!mk || !mk.series || !(mk.series.rows || []).length) {
      return '<div class="emptystate">No price series yet.<div class="runwrap">' + runButton("request data " + st.ticker, "the fetch workflow fills data/market in ~5 minutes") + "</div></div>";
    }
    var rows = mk.series.rows;
    var step = Math.max(1, Math.floor(rows.length / 420));
    var pts = rows.filter(function (_, i) { return i % step === 0 || i === rows.length - 1; });
    var W = 940, H = 360, P = { l: 52, r: 76, t: 30, b: 34 };
    var iw = W - P.l - P.r, ih = H - P.t - P.b;
    var vals = pts.map(function (r) { return r[1]; });
    var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
    if (st.entry_zone) { lo = Math.min(lo, st.entry_zone.low); hi = Math.max(hi, st.no_entry_above || hi); }
    var pad = (hi - lo) * 0.07; lo -= pad; hi += pad;
    function X(i) { return P.l + (i / (pts.length - 1)) * iw; }
    function Y(v) { return P.t + (1 - (v - lo) / (hi - lo)) * ih; }
    var s = '<div class="chartwrap"><svg id="pxchart" viewBox="0 0 ' + W + " " + H + '" width="100%" style="max-width:' + W + 'px" role="img" aria-label="price chart">';
    if (st.entry_zone) {
      s += '<rect x="' + P.l + '" y="' + Y(st.entry_zone.high) + '" width="' + iw + '" height="' + (Y(st.entry_zone.low) - Y(st.entry_zone.high)) + '" fill="var(--band-good)"/>' +
        '<line x1="' + P.l + '" y1="' + Y(st.entry_zone.high) + '" x2="' + (W - P.r) + '" y2="' + Y(st.entry_zone.high) + '" stroke="var(--und)" stroke-width="0.9" stroke-dasharray="4 4" opacity="0.7"/>' +
        '<line x1="' + P.l + '" y1="' + Y(st.entry_zone.low) + '" x2="' + (W - P.r) + '" y2="' + Y(st.entry_zone.low) + '" stroke="var(--und)" stroke-width="0.9" stroke-dasharray="4 4" opacity="0.7"/>' +
        '<text x="' + (W - P.r + 6) + '" y="' + (Y(st.entry_zone.high) + 4) + '" font-size="10" class="mono-t" fill="var(--und)">' + esc(st.entry_zone.high) + "</text>" +
        '<text x="' + (W - P.r + 6) + '" y="' + (Y(st.entry_zone.low) + 4) + '" font-size="10" class="mono-t" fill="var(--und)">' + esc(st.entry_zone.low) + "</text>" +
        '<text x="' + (P.l + 8) + '" y="' + (Y(st.entry_zone.high) + 14) + '" font-size="10" font-weight="600" fill="var(--und)">ENTRY ZONE</text>';
    }
    if (st.no_entry_above) {
      s += '<line x1="' + P.l + '" y1="' + Y(st.no_entry_above) + '" x2="' + (W - P.r) + '" y2="' + Y(st.no_entry_above) + '" stroke="var(--ovr)" stroke-width="0.9" stroke-dasharray="2 5"/>' +
        '<text x="' + (W - P.r + 6) + '" y="' + (Y(st.no_entry_above) + 4) + '" font-size="10" class="mono-t" fill="var(--ovr)">' + esc(st.no_entry_above) + " no entry</text>";
    }
    for (var t = 0; t <= 4; t++) {
      var v = lo + ((hi - lo) * t) / 4;
      s += '<line x1="' + P.l + '" y1="' + Y(v) + '" x2="' + (W - P.r) + '" y2="' + Y(v) + '" stroke="var(--chart-grid)"/>';
      // top tick carries the axis name inline; the rest keep bare numbers (Evidence axis grammar)
      // sits just inside the plot on the top gridline, so the event-label band above stays clear
      if (t === 4) s += '<text x="' + (P.l + 6) + '" y="' + (Y(v) + 13) + '" font-size="10" class="mono-t" fill="var(--ink-3)">' + v.toFixed(0) + "   price, " + esc((mk.series.currency || "USD")) + "</text>";
      else s += '<text x="' + (P.l - 8) + '" y="' + (Y(v) + 3) + '" text-anchor="end" font-size="10" class="mono-t" fill="var(--chart-axis)">' + v.toFixed(0) + "</text>";
    }
    var lbl = Math.max(1, Math.floor(pts.length / 6));
    pts.forEach(function (r, i) { if (i % lbl === 0 && i < pts.length - 3) s += '<text x="' + X(i) + '" y="' + (H - P.b + 16) + '" text-anchor="middle" font-size="9.5" class="mono-t" fill="var(--chart-axis)">' + esc(r[0].slice(0, 7)) + "</text>"; });
    // An event outside the price window is exactly the one that must not vanish: a SCHEDULED
    // occurrence or a dated calendar entry is future by definition. Clamp it to the edge instead.
    (st.events || []).forEach(function (e, ei) {
      var idx = -1, off = "";
      pts.forEach(function (r, i) { if (idx < 0 && r[0] >= e.date) idx = i; });
      if (idx < 0) { idx = pts.length - 1; off = "after"; }
      else if (e.date < pts[0][0]) { idx = 0; off = "before"; }
      var ex = X(idx) + (off === "after" ? 10 : off === "before" ? -10 : 0);
      var lyy = ei % 2 === 0 ? P.t - 6 : P.t - 18;
      var col = off ? "var(--emg)" : "var(--chart-axis)";
      s += '<line x1="' + ex + '" y1="' + (P.t - 2) + '" x2="' + ex + '" y2="' + (H - P.b) + '" stroke="' + col + '" stroke-dasharray="' + (off ? "1 4" : "2 4") + '"/>';
      if (off) s += '<path d="M' + ex + " " + (P.t + 4) + " l" + (off === "after" ? 5 : -5) + " 5 l" + (off === "after" ? -5 : 5) + ' 5 z" fill="var(--emg)"/>';
      s += '<text x="' + ex + '" y="' + lyy + '" text-anchor="' + (off === "after" ? "end" : off === "before" ? "start" : "middle") + '" font-size="9" fill="' + (off ? "var(--emg)" : "var(--ink-3)") + '">' +
        esc(e.label.length > 26 ? e.label.slice(0, 25) + "…" : e.label) + (off ? " · " + esc(e.date) : "") + "</text>";
    });
    var path = pts.map(function (r, i) { return (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(r[1]).toFixed(1); }).join("");
    s += '<path d="' + path + '" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>';
    var last = pts[pts.length - 1];
    s += '<circle cx="' + X(pts.length - 1) + '" cy="' + Y(last[1]) + '" r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>';
    s += '<text x="' + (X(pts.length - 1) + 9) + '" y="' + (Y(last[1]) + 4) + '" font-size="11.5" font-weight="650" class="mono-t" fill="var(--ink)">' + last[1] + "</text>";
    s += '<text x="' + (W - P.r) + '" y="' + (H - 6) + '" text-anchor="end" font-size="10.5" class="mono-t" fill="var(--ink-3)">date \u2192</text>';
    s += '<rect id="pxhover" x="' + P.l + '" y="' + P.t + '" width="' + iw + '" height="' + ih + '" fill="transparent"/>';
    s += "</svg></div>";
    s += '<div class="muted num" style="margin-top:8px">prices [' + esc(mk.series.source) + ", as of " + esc(mk.series.as_of) + "] · " + esc(mk.price_status) +
      (mk.price_status === "DISPUTED" ? " — both prints kept in data/market, never averaged" : "") + "</div>";
    window.__px = { pts: pts, X: X, Y: Y, P: P, W: W };
    return s;
  }

  /* ---------------- cortex ---------------- */
  /* v3: the whole machine as one field. d3-force (vendored, ISC) lays out every
     research object — signals, chains, links, scenarios, screens, names, dives,
     shadow rows, candidates, known future events — plus a dust halo of raw feed
     headlines. One graph<->screen transform; zoom, pan, drag, neighbour-dim. */
  var CXP = {
    bg0: "#08080d", bg1: "#14141c",
    ink: "#dde0ef", ink2: "#9296ad", ink3: "#585c72",
    accent: "#8687f0",
    verd: { QUIET: "#7b8496", UNDISCOVERED: "#34c77e", EMERGING: "#e3b23c", CROWDED: "#e97f4e", OVER_CROWDED: "#c14a62" },
    dive: { INVESTABLE: "#34c77e", WATCH: "#e3b23c", TOO_LATE: "#c14a62" },
    none: "#6a6e86", gold: "#d4a017", bad: "#e05a72",
    fam: { POLICY: "#e3b23c", CORPORATE: "#8687f0", TECH: "#34c77e", PHYSICAL: "#e97f4e", GEO: "#c14a62", MACRO: "#e3b23c", LEGAL: "#e3b23c" }
  };
  var CX_W = 1200, CX_H = 760, CX_NOWX = 720, CX_CLAMP = 1460;
  var CX_CHARGE = { sig: -900, chain: -700, scen: -420, screen: -380, dive: -320, shadow: -260, link: -180, evt: -110, cand: -70, co: -60, socket: 0, dust: -3 };
  var CX_EDGE = {
    "sig-chain":   { d: 90,  s: 0.55, a: 0.16 },
    "chain-link":  { d: 120, s: 0.22, a: 0.07 },
    "link-link":   { d: 58,  s: 0.30, a: 0.13 },
    "chain-scen":  { d: 150, s: 0.35, a: 0.10 },
    "scen-link":   { d: 105, s: 0.06, a: 0.035 },
    "scen-screen": { d: 80,  s: 0.50, a: 0.14 },
    "screen-co":   { d: 60,  s: 0.35, a: 0.09 },
    "co-link":     { d: 34,  s: 0.10, a: 0.04 },
    "dive-co":     { d: 40,  s: 0.60, a: 0.18 },
    "dive-shadow": { d: 30,  s: 0.70, a: 0.18 }
  };
  var CX_ORDER = { sig: 0, chain: 1, link: 2, scen: 3, screen: 4, co: 5, dive: 6, shadow: 7, cand: 8, evt: 9, socket: 10 };
  function cxTrim(s, n) { s = String(s || ""); return s.length > n ? s.slice(0, n - 1) + "…" : s; }
  function cxTimeX(dateStr) {
    var dx = daysBetween(TODAY, dateStr);
    if (isNaN(dx)) dx = 0;
    var t = Math.sqrt(Math.min(Math.abs(dx), CX_CLAMP) / CX_CLAMP);
    return dx < 0 ? CX_NOWX - t * 560 : CX_NOWX + t * 380;
  }

  /* ---- graph model: every research object in the payload ---- */
  function cxBuild() {
    var nodes = [], edges = [], byKey = {}, i;
    function add(n) {
      n.key = n.kind + ":" + n.id;
      if (byKey[n.key]) return byKey[n.key];
      n.x = n.x0; n.y = n.y0;
      byKey[n.key] = n; nodes.push(n); return n;
    }
    function join(aKey, bKey, type) {
      if (!byKey[aKey] || !byKey[bKey] || aKey === bKey) return;
      edges.push({ source: aKey, target: bKey, type: type, alpha: (CX_EDGE[type] || {}).a || 0.06 });
    }
    var cx0 = CX_W / 2, cy0 = CX_H / 2;
    function seedX(t) { return cx0 + (t - 0.5) * 460 + (Math.random() - 0.5) * 90; }
    function seedY(t) { return cy0 + (t - 0.5) * 300 + (Math.random() - 0.5) * 90; }

    // signals
    var sigs = (D.signals || []).filter(function (s) { return s.status !== "DISMISSED" && s.status !== "EXPIRED"; });
    sigs.forEach(function (sg, si) {
      var occ = sg.occurrence || null;
      var anchor = (occ && occ.anchor_date) || sg.created_at || TODAY;
      var un = (sg.unmappedness || {}).score || 0;
      var tx = cxTimeX(anchor);
      add({
        kind: "sig", id: sg.id, ref: sg, rSem: 10 + 42 * Math.pow(un / 100, 1.8),

  /* ---- simulation (vendored d3-force; we own the clock) ---- */
  function cxRingForce(g) {
    var ns;
    function force(alpha) {
      if (!g.ring) return;
      for (var i = 0; i < ns.length; i++) {
        var n = ns[i];
        if (n.kind !== "dust" || n.sx == null) continue;
        n.vx += (n.sx - n.x) * 0.08 * alpha;
        n.vy += (n.sy - n.y) * 0.08 * alpha;
      }
    }
    force.initialize = function (_) { ns = _; };
    return force;
  }
  function cxSeats(g) {
    var minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
    g.nodes.forEach(function (n) {
      if (n.kind === "dust") return;
      if (n.x < minX) minX = n.x; if (n.x > maxX) maxX = n.x;
      if (n.y < minY) minY = n.y; if (n.y > maxY) maxY = n.y;
    });
    if (minX > maxX) { minX = 0; maxX = CX_W; minY = 0; maxY = CX_H; }
    var cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
    var r0 = 0.62 * Math.max(maxX - minX, maxY - minY), band = 0.28 * r0;
    g.ring = { cx: cx, cy: cy, r0: r0, band: band };
    g.nodes.forEach(function (n) {
      if (n.kind !== "dust") return;
      var ang = n.seat * 2.399963 + 0.13;
      var rad = r0 + band * ((n.seat * 0.6180339) % 1);
      n.sx = cx + rad * Math.cos(ang);
      n.sy = cy + rad * Math.sin(ang) * 0.92;
    });
  }
  function cxSim(g) {
    var sim = d3.forceSimulation(g.nodes)
      .velocityDecay(0.55)
      .force("charge", d3.forceManyBody().theta(0.9).distanceMin(2).distanceMax(420)
        .strength(function (n) { return CX_CHARGE[n.kind] != null ? CX_CHARGE[n.kind] : -80; }))
      .force("link", d3.forceLink(g.edges).id(function (n) { return n.key; })
        .distance(function (e) { return (CX_EDGE[e.type] || {}).d || 80; })
        .strength(function (e) { return (CX_EDGE[e.type] || {}).s || 0.2; }))
      .force("collide", d3.forceCollide(function (n) { return n.kind === "dust" ? 1.8 : n.r + 2; }).strength(0.65))
      .force("x", d3.forceX(CX_W / 2).strength(function (n) { return n.kind === "dust" ? 0 : 0.0022; }))
      .force("y", d3.forceY(CX_H / 2).strength(function (n) { return n.kind === "dust" ? 0 : 0.0035; }))
      .force("ring", cxRingForce(g));
    sim.stop();
    var i;
    for (i = 0; i < 70; i++) sim.tick();     // structure first, dust free
    cxSeats(g);                               // annulus from the settled core
    for (i = 0; i < 20; i++) sim.tick();     // dust snaps toward its seats
    var bad = false;
    g.nodes.forEach(function (n) { if (!isFinite(n.x) || !isFinite(n.y)) bad = true; });
    if (bad) {
      g.nodes.forEach(function (n) { n.x = n.x0; n.y = n.y0; n.vx = n.vy = 0; });
      for (i = 0; i < 60; i++) sim.tick();
    }
    return sim;
  }

  /* ---- view: one graph<->screen transform for everything ---- */
  var CX_CACHE = null;
  var CX_F = 900; // focal length; effective zoom k = CX_F / cam.dist
  function cxCam(g, w, h) {
    // frame the research core; the dust halo may bleed off-frame
    var minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
    g.nodes.forEach(function (n) {
      if (n.kind === "dust") return;

      if (n.y < minY) minY = n.y; if (n.y > maxY) maxY = n.y;
    });
    if (minX > maxX) { minX = 0; maxX = CX_W; minY = 0; maxY = CX_H; }

  /* ---- instrument rails: every register is real data ---- */
  function cxReg(k, v, dim) { return '<div class="cx-reg"><span class="k">' + esc(k) + '</span><span class="v' + (dim ? " dim" : "") + '">' + esc(v) + "</span></div>"; }

    [["undiscovered", vc.UNDISCOVERED, "var(--und)"], ["emerging", vc.EMERGING, "var(--emg)"],
     ["crowded", vc.CROWDED, "var(--crd)"], ["over-crowded", vc.OVER_CROWDED, "var(--ovr)"],
