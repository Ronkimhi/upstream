<meta charset="utf-8">
<title>Upstream</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Upstream UI v2 — calm SaaS register (Linear/Vercel), one expressive layer: the funnel.
   Token-driven, three-state theming per the artifact contract. */
:root {
  --bg: #FAFAFB; --surface: #FFFFFF; --surface-2: #F3F3F7; --surface-3: #EDEDF2;
  --border: #ECECF1; --border-strong: #DCDCE4;
  --ink: #17171E; --ink-2: #55555F; --ink-3: #8A8A96;
  --accent: #5B5BD6; --accent-ink: #4646C8; --accent-soft: #EFEFFC; --accent-line: #C9C9F2;
  --und: #1F9D5B; --und-ink: #14713F; --und-bg: #E7F6EE;
  --emg: #C08A0B; --emg-ink: #7D5A05; --emg-bg: #FAF2DA;
  --crd: #D2622B; --crd-ink: #96421B; --crd-bg: #FBEBE0;
  --ovr: #C13A52; --ovr-ink: #92223C; --ovr-bg: #F9E5EA;
  --gold: #B8860B;
  --good: #1F9D5B; --warn: #C08A0B; --bad: #C13A52;
  --band-good: rgba(31, 157, 91, 0.10); --band-bad: rgba(193, 58, 82, 0.07);
  --chart-grid: #EEEEF3; --chart-axis: #B9B9C4;
  --shadow: 0 1px 2px rgba(23, 23, 30, 0.04), 0 6px 24px rgba(23, 23, 30, 0.05);
  --shadow-lift: 0 2px 4px rgba(23, 23, 30, 0.06), 0 12px 32px rgba(23, 23, 30, 0.09);
  --btn-ink: #FFFFFF;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C0C10; --surface: #14141A; --surface-2: #1A1A22; --surface-3: #22222B;
    --border: #222229; --border-strong: #32323C;
    --ink: #EDEDF3; --ink-2: #A6A6B3; --ink-3: #70707E;
    --accent: #8687F0; --accent-ink: #A7A8F6; --accent-soft: #1D1D31; --accent-line: #3A3A66;
    --und: #34C77E; --und-ink: #83E2B1; --und-bg: rgba(52, 199, 126, 0.12);
    --emg: #E3B23C; --emg-ink: #F0CF83; --emg-bg: rgba(227, 178, 60, 0.12);
    --crd: #E97F4E; --crd-ink: #F4AC87; --crd-bg: rgba(233, 127, 78, 0.12);
    --ovr: #E25C78; --ovr-ink: #F19AAC; --ovr-bg: rgba(226, 92, 120, 0.13);
    --gold: #D9A94B;
    --good: #34C77E; --warn: #E3B23C; --bad: #E25C78;
    --band-good: rgba(52, 199, 126, 0.10); --band-bad: rgba(226, 92, 120, 0.08);
    --chart-grid: #1F1F28; --chart-axis: #4A4A58;
    --shadow: none; --shadow-lift: 0 12px 32px rgba(0, 0, 0, 0.5);
    --btn-ink: #0C0C10;
  }
}
:root[data-theme="dark"] {
  --bg: #0C0C10; --surface: #14141A; --surface-2: #1A1A22; --surface-3: #22222B;
  --border: #222229; --border-strong: #32323C;
  --ink: #EDEDF3; --ink-2: #A6A6B3; --ink-3: #70707E;
  --accent: #8687F0; --accent-ink: #A7A8F6; --accent-soft: #1D1D31; --accent-line: #3A3A66;
  --und: #34C77E; --und-ink: #83E2B1; --und-bg: rgba(52, 199, 126, 0.12);
  --emg: #E3B23C; --emg-ink: #F0CF83; --emg-bg: rgba(227, 178, 60, 0.12);
  --crd: #E97F4E; --crd-ink: #F4AC87; --crd-bg: rgba(233, 127, 78, 0.12);
  --ovr: #E25C78; --ovr-ink: #F19AAC; --ovr-bg: rgba(226, 92, 120, 0.13);
  --gold: #D9A94B;
  --good: #34C77E; --warn: #E3B23C; --bad: #E25C78;
  --band-good: rgba(52, 199, 126, 0.10); --band-bad: rgba(226, 92, 120, 0.08);
  --chart-grid: #1F1F28; --chart-axis: #4A4A58;
  --shadow: none; --shadow-lift: 0 12px 32px rgba(0, 0, 0, 0.5);
  --btn-ink: #0C0C10;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scrollbar-gutter: stable; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 14.5px/1.6 Inter, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-feature-settings: "cv11", "ss01";
}
.mono, code { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
a { color: var(--accent-ink); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
button { font: inherit; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ================= shell ================= */
.topbar {
  position: sticky; top: 0; z-index: 40; display: flex; align-items: center; gap: 18px;
  padding: 0 26px; height: 52px;
  background: color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter: blur(12px); border-bottom: 1px solid var(--border);
}
.wordmark { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; letter-spacing: 0.05em;
  font-size: 13.5px; color: var(--ink); }
.wordmark .tick { color: var(--accent); font-size: 11px; }
.nav { display: flex; align-items: center; gap: 2px; }
.nav a { color: var(--ink-3); font-size: 13px; font-weight: 500; padding: 5px 11px; border-radius: 7px; }
.nav a:hover { color: var(--ink); background: var(--surface-2); text-decoration: none; }
.nav a.on { color: var(--ink); background: var(--surface-2); font-weight: 600; }
.topbar .spacer { flex: 1; }
.builtat { font-size: 11px; color: var(--ink-3); }
.healthdot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex: none; }
.tb-chip { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--ink-2);
  border: 1px solid var(--border); border-radius: 999px; padding: 3.5px 11px; background: var(--surface); }
.tb-btn { cursor: pointer; border: none; background: none; color: var(--ink-3); border-radius: 7px;
  padding: 5px 9px; font-size: 12.5px; }
.tb-btn:hover { color: var(--ink); background: var(--surface-2); }
@media (max-width: 760px) {
  .topbar { flex-wrap: wrap; height: auto; padding: 8px 16px; gap: 8px 12px; row-gap: 6px; }
  .nav a { padding: 4px 8px; font-size: 12.5px; }
  .tb-chip { font-size: 11px; padding: 2.5px 8px; }
  main { padding: 8px 16px 70px; }
  .crumbs { padding: 12px 16px 0; }
}

.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; padding: 16px 26px 0;
  max-width: 1160px; margin: 0 auto; font-size: 12.5px; color: var(--ink-3); }
.crumbs a { color: var(--ink-3); }
.crumbs a:hover { color: var(--ink); text-decoration: none; }
.crumbs .here { color: var(--ink); font-weight: 550; }
.crumbs .sep { color: var(--border-strong); }

main { max-width: 1160px; margin: 0 auto; padding: 10px 26px 90px; }
h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.03em; margin: 14px 0 6px; text-wrap: balance; }
.sub { color: var(--ink-2); font-size: 14px; max-width: 76ch; margin: 0 0 10px; }
.seclabel { font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: 0.09em;
  color: var(--ink-3); margin: 44px 0 14px; display: flex; align-items: center; gap: 10px; }
.seclabel::after { content: ""; flex: 1; height: 1px; background: var(--border); }
h3 { font-size: 13.5px; font-weight: 600; margin: 0 0 8px; letter-spacing: -0.01em; }

/* ================= primitives ================= */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  padding: 18px 20px; box-shadow: var(--shadow); }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 650;
  letter-spacing: 0.04em; text-transform: uppercase; border-radius: 6px; padding: 2.5px 7px; white-space: nowrap; }
.chip.neutral { background: var(--surface-2); color: var(--ink-2); }
.chip.accent { background: var(--accent-soft); color: var(--accent-ink); }
.chip.UNDISCOVERED, .chip.INVESTABLE, .chip.DARK, .chip.RIGHT { background: var(--und-bg); color: var(--und-ink); }
.chip.EMERGING, .chip.WATCH, .chip.MIXED { background: var(--emg-bg); color: var(--emg-ink); }
.chip.CROWDED { background: var(--crd-bg); color: var(--crd-ink); }
.chip.OVER_CROWDED, .chip.TOO_LATE, .chip.WRONG { background: var(--ovr-bg); color: var(--ovr-ink); }
.chip.stale { background: var(--emg-bg); color: var(--emg-ink); text-transform: none; letter-spacing: 0; }
.chip.verystale { background: var(--ovr-bg); color: var(--ovr-ink); text-transform: none; letter-spacing: 0; }
.chip.tier { background: var(--surface-2); color: var(--ink-3); font-family: "JetBrains Mono", monospace; }
.num { font-family: "JetBrains Mono", monospace; font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); font-size: 12px; }
.small { font-size: 12.5px; color: var(--ink-2); }
.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex: none; }

/* run affordance: primary button + subdued command line */
.runwrap { display: inline-flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.btn-run { cursor: pointer; border: none; border-radius: 9px; padding: 8px 16px;
  font-weight: 600; font-size: 13px; letter-spacing: 0.01em;
  background: var(--accent); color: var(--btn-ink); transition: transform 0.06s, box-shadow 0.12s; }
.btn-run:hover { box-shadow: var(--shadow-lift); transform: translateY(-1px); }
.btn-run:active { transform: translateY(0); }
.btn-run:disabled { opacity: 0.55; cursor: default; transform: none; box-shadow: none; }
.btn-run.q { background: var(--und-bg); color: var(--und-ink); box-shadow: none; cursor: default; }
.cmdline { display: inline-flex; align-items: center; gap: 7px; font-size: 11px; color: var(--ink-3); }
.cmdline code { font-size: 11px; color: var(--ink-3); background: var(--surface-2);
  border-radius: 5px; padding: 1.5px 6px; }
.cmdline button { cursor: pointer; border: none; background: none; color: var(--ink-3);
  font-size: 11px; padding: 1px 4px; border-radius: 4px; }
.cmdline button:hover { color: var(--ink); background: var(--surface-2); }

.toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); z-index: 90;
  background: var(--ink); color: var(--bg); border-radius: 10px; padding: 10px 18px;
  font-size: 13px; box-shadow: var(--shadow-lift); max-width: 88vw; }

table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.07em;
  color: var(--ink-3); font-weight: 650; padding: 8px 12px; border-bottom: 1px solid var(--border); }
td { padding: 11px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
tr:last-child td { border-bottom: none; }
tbody tr:hover td { background: color-mix(in srgb, var(--surface-2) 55%, transparent); }
.tablewrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; box-shadow: var(--shadow); }

/* ================= home ================= */
.hero { display: grid; grid-template-columns: 1.25fr 1fr; gap: 14px; margin-top: 18px; }
@media (max-width: 860px) { .hero { grid-template-columns: 1fr; } }
.today h2 { font-size: 17px; font-weight: 650; letter-spacing: -0.02em; margin: 0 0 4px; }
.today .when { font-size: 12px; color: var(--ink-3); margin-bottom: 12px; }
.delta { list-style: none; margin: 0; padding: 0; }
.delta li { display: flex; gap: 10px; align-items: baseline; padding: 7px 0; font-size: 13.5px;
  border-top: 1px solid var(--border); }
.delta li:first-child { border-top: none; }
.delta .k { flex: none; font-size: 10.5px; font-weight: 650; text-transform: uppercase; letter-spacing: 0.05em;
  border-radius: 5px; padding: 2px 6px; margin-top: 1px; }
.delta .k.new { background: var(--accent-soft); color: var(--accent-ink); }
.delta .k.trip { background: var(--ovr-bg); color: var(--ovr-ink); }
.delta .k.due { background: var(--emg-bg); color: var(--emg-ink); }
.delta .k.upd { background: var(--surface-2); color: var(--ink-2); }
.quiet { display: flex; flex-direction: column; gap: 2px; padding: 10px 0 4px; }
.quiet .big { font-size: 19px; font-weight: 650; letter-spacing: -0.02em; }

.funnelcard { display: flex; flex-direction: column; }
.funnelcard .fc-title { font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: 0.09em; color: var(--ink-3); margin-bottom: 14px; }
.funnel { width: 100%; }
.funnel .stagelabel { font-size: 11px; fill: var(--ink-2); font-weight: 550; }
.funnel .stagecount { font-family: "JetBrains Mono", monospace; font-size: 17px; font-weight: 600; fill: var(--ink); }
.funnel a { cursor: pointer; }
.funnel a:hover .fseg { filter: brightness(1.06); }

.siglist { display: flex; flex-direction: column; }
.sigrow { display: grid; grid-template-columns: 1fr auto; gap: 6px 18px; padding: 16px 20px;
  background: var(--surface); border: 1px solid var(--border); border-top: none; text-decoration: none; color: inherit; }
.sigrow:first-child { border-top: 1px solid var(--border); border-radius: 12px 12px 0 0; }
.sigrow:last-child { border-radius: 0 0 12px 12px; }
.sigrow:only-child { border-radius: 12px; }
.sigrow { cursor: pointer; }
.sigrow:hover { background: color-mix(in srgb, var(--surface-2) 45%, var(--surface)); text-decoration: none; }
.sigrow .t { font-size: 15.5px; font-weight: 600; letter-spacing: -0.015em; margin: 2px 0 3px; }
.sigrow .th { font-size: 13px; color: var(--ink-2); max-width: 68ch;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.sigrow .meta { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--ink-3); }
.sigrow .right { display: flex; flex-direction: column; align-items: flex-end; justify-content: space-between; gap: 8px; }
@media (max-width: 700px) { .sigrow { grid-template-columns: 1fr; } .sigrow .right { flex-direction: row; align-items: center; justify-content: space-between; } }
.gauge { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--ink-3); }
.gauge .track { width: 74px; height: 5px; border-radius: 3px; background: var(--surface-3); overflow: hidden; }
.gauge .track i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }

.sysline { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--ink-3);
  padding: 9px 0; border-top: 1px solid var(--border); }
.sysline:first-of-type { border-top: none; }
.sysline .mono { font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ================= chain ================= */
.pagehead { margin-top: 16px; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 9px; padding: 3px; margin: 20px 0 20px; }
.seg button { cursor: pointer; border: none; background: none; color: var(--ink-3); font-weight: 550;
  font-size: 13px; padding: 6px 15px; border-radius: 7px; }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); font-weight: 600; }

.flow { display: flex; flex-wrap: wrap; align-items: stretch; gap: 10px 6px; }
.fnode { position: relative; cursor: pointer; background: var(--surface); border: 1px solid var(--border);
  border-left-width: 3px; border-radius: 11px; padding: 11px 13px 10px; width: 170px; flex: 0 1 170px;
  box-shadow: var(--shadow); transition: transform 0.07s, box-shadow 0.12s; }
.fnode:hover { transform: translateY(-2px); box-shadow: var(--shadow-lift); }
.fnode.v-UNDISCOVERED { border-left-color: var(--und); }
.fnode.v-EMERGING { border-left-color: var(--emg); }
.fnode.v-CROWDED { border-left-color: var(--crd); }
.fnode.v-OVER_CROWDED { border-left-color: var(--ovr); }
.fnode.v-none { border-left-color: var(--border-strong); border-style: dashed; }
.fnode .pos { font-size: 9.5px; color: var(--ink-3); font-family: "JetBrains Mono", monospace; margin-bottom: 3px; }
.fnode .nm { font-size: 13px; font-weight: 600; line-height: 1.3; letter-spacing: -0.01em; min-height: 34px; }
.fnode .verd { font-size: 9.5px; font-weight: 650; letter-spacing: 0.05em; text-transform: uppercase; margin-top: 7px; }
.fnode .verd.v-UNDISCOVERED { color: var(--und-ink); } .fnode .verd.v-EMERGING { color: var(--emg-ink); }
.fnode .verd.v-CROWDED { color: var(--crd-ink); } .fnode .verd.v-OVER_CROWDED { color: var(--ovr-ink); }
.fnode .verd.v-none { color: var(--ink-3); text-transform: none; letter-spacing: 0; }
.triad { display: flex; align-items: flex-end; gap: 3px; height: 22px; position: absolute; right: 12px; bottom: 10px; }
.triad i { display: block; width: 5px; border-radius: 2px 2px 1px 1px; min-height: 2px; }
.triad .ti { background: var(--accent); } .triad .tc { background: var(--crd); } .triad .tv { background: var(--und); }
.fnode .star { position: absolute; top: 8px; right: 10px; color: var(--gold); font-size: 13px; }
.fnode .choke { position: absolute; top: -5px; left: 10px; width: 9px; height: 9px; border-radius: 50%;
  border: 2px solid var(--ovr); background: var(--bg); }
.farrow { align-self: center; color: var(--border-strong); font-size: 14px; padding: 0 1px; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 16px; font-size: 11.5px; color: var(--ink-2); align-items: center; }
.legend .sw { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.legend .tri-demo { display: inline-flex; align-items: flex-end; gap: 2px; height: 12px; margin-right: 6px; vertical-align: -2px; }
.legend .tri-demo i { width: 4px; border-radius: 1px; }

.callout { border: 1px solid var(--border); border-left: 3px solid var(--gold); border-radius: 11px;
  background: var(--surface); padding: 13px 16px; font-size: 13px; color: var(--ink-2); box-shadow: var(--shadow); }
.callout b { color: var(--ink); }

/* drawer */
.scrim { position: fixed; inset: 0; z-index: 49; background: rgba(0, 0, 0, 0.28); }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(460px, 94vw); z-index: 50; background: var(--surface);
  border-left: 1px solid var(--border); box-shadow: -16px 0 48px rgba(0, 0, 0, 0.18); padding: 22px 24px; overflow-y: auto; }
.drawer .x { position: absolute; top: 14px; right: 16px; cursor: pointer; border: none; background: var(--surface-2);
  border-radius: 7px; width: 28px; height: 28px; color: var(--ink-2); font-size: 13px; }
.drawer h2 { font-size: 18px; font-weight: 650; letter-spacing: -0.02em; margin: 10px 0 6px; }
.scorebar { display: grid; grid-template-columns: 100px 1fr 40px; align-items: center; gap: 12px; margin: 8px 0; }
.scorebar .lb { font-size: 12px; color: var(--ink-2); font-weight: 550; }
.scorebar .tk { height: 6px; border-radius: 3px; background: var(--surface-3); overflow: hidden; }
.scorebar .tk i { display: block; height: 100%; border-radius: 3px; }
.scorebar .vl { font-family: "JetBrains Mono", monospace; font-size: 12.5px; text-align: right; }
.evli { font-size: 12.5px; color: var(--ink-2); margin: 6px 0; padding-left: 11px; border-left: 2px solid var(--border); }
.drawer h3 { margin-top: 18px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-3); }

/* scenarios */
.scen { padding: 18px 20px; margin-bottom: 12px; }
.scen .head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.scen .head .t { font-size: 15.5px; font-weight: 650; letter-spacing: -0.015em; }
.scen .p { margin-left: auto; font-family: "JetBrains Mono", monospace; font-size: 21px; font-weight: 600; }
.scen .p small { font-size: 11px; color: var(--ink-3); font-weight: 400; margin-left: 2px; }
.pbar { height: 4px; border-radius: 2px; background: var(--surface-3); overflow: hidden; margin: 10px 0 12px; }
.pbar i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }
.mv { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; border-radius: 7px;
  padding: 3px 9px; margin: 2px 4px 2px 0; background: var(--surface-2); color: var(--ink-2); }
.mv .up { color: var(--good); font-weight: 700; } .mv .down { color: var(--bad); font-weight: 700; }
details { border: none; padding: 0; margin: 10px 0 0; }
summary { cursor: pointer; font-size: 12.5px; font-weight: 550; color: var(--ink-3); list-style: none; }
summary::before { content: "▸ "; font-size: 10px; }
details[open] summary::before { content: "▾ "; }
summary:hover { color: var(--ink); }
details .body { margin: 10px 0 0 14px; }
.bullets { margin: 0; padding-left: 0; list-style: none; font-size: 13px; }
.bullets li { margin: 7px 0; padding-left: 16px; position: relative; }
.bullets li::before { content: ""; position: absolute; left: 0; top: 8px; width: 6px; height: 6px; border-radius: 50%; background: var(--ink-3); }
.bullets.good li::before { background: var(--good); }
.bullets.bad li::before { background: var(--bad); }

/* ================= screen ================= */
.tk-name { font-weight: 650; font-size: 14px; }
.tk-co { font-size: 11.5px; color: var(--ink-3); margin-top: 1px; }
.pend { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--emg-ink); }
.pend .dot { background: var(--warn); }
blockquote { margin: 8px 0; padding: 9px 13px; border-left: 3px solid var(--accent); background: var(--surface-2);
  border-radius: 0 9px 9px 0; font-size: 12.5px; color: var(--ink-2); }
.healthline { font-family: "JetBrains Mono", monospace; font-size: 11px; color: var(--ink-3); margin-top: 14px; }

/* ================= stock ================= */
.fixturebanner { background: var(--emg-bg); color: var(--emg-ink); border-radius: 10px;
  padding: 9px 14px; font-size: 12.5px; font-weight: 550; margin-top: 16px; }
.vhero { display: flex; align-items: center; gap: 26px; flex-wrap: wrap; border-radius: 14px;
  padding: 20px 24px; margin-top: 14px; border: 1px solid var(--border); background: var(--surface); box-shadow: var(--shadow); }
.vhero .vword { display: flex; align-items: center; gap: 11px; font-size: 21px; font-weight: 750; letter-spacing: -0.02em; }
.vhero .vword .dot { width: 11px; height: 11px; }
.vhero.INVESTABLE .vword { color: var(--und-ink); } .vhero.INVESTABLE .vword .dot { background: var(--und); }
.vhero.WATCH .vword { color: var(--emg-ink); } .vhero.WATCH .vword .dot { background: var(--emg); }
.vhero.TOO_LATE .vword { color: var(--ovr-ink); } .vhero.TOO_LATE .vword .dot { background: var(--ovr); }
.vhero .zone { display: flex; flex-direction: column; gap: 1px; }
.vhero .zone .zl { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-3); font-weight: 650; }
.vhero .zone .zv { font-family: "JetBrains Mono", monospace; font-size: 19px; font-weight: 600; }
.vhero .right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.statgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 7px 16px; font-size: 13px; }
.kv dt { color: var(--ink-3); } .kv dd { margin: 0; }
.redteam { border-left: 3px solid var(--ovr); }
.rt-label { font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ovr-ink); }
.note { background: var(--surface-2); border-radius: 10px; padding: 10px 14px; font-size: 13px; margin: 8px 0; }
.note .who { font-weight: 650; color: var(--ink-2); font-size: 11px; }
.timeline { border-left: 2px solid var(--border); margin: 6px 0 0 6px; padding-left: 16px; }
.timeline .t { margin-bottom: 12px; font-size: 13px; }
.timeline .t .when { color: var(--ink-3); font-size: 11px; font-family: "JetBrains Mono", monospace; }

/* stat tile */
.stat { display: flex; flex-direction: column; gap: 2px; }
.stat .v { font-family: "JetBrains Mono", monospace; font-size: 30px; font-weight: 650; letter-spacing: -0.02em; }
.stat .l { font-size: 12px; color: var(--ink-3); }

/* ================= charts ================= */
.chartwrap { overflow-x: auto; }
svg text { font-family: Inter, sans-serif; fill: var(--ink-2); }
svg .mono-t { font-family: "JetBrains Mono", monospace; font-variant-numeric: tabular-nums; }
.tooltip { position: fixed; z-index: 80; pointer-events: none; background: var(--ink); color: var(--bg);
  border-radius: 8px; padding: 6px 11px; font-size: 12px; box-shadow: var(--shadow-lift); }

.emptystate { text-align: center; padding: 44px 20px; color: var(--ink-3); border: 1.5px dashed var(--border-strong);
  border-radius: 14px; font-size: 13.5px; }
.emptystate .runwrap { align-items: center; margin-top: 14px; }
.footer { margin-top: 60px; padding-top: 16px; border-top: 1px solid var(--border); font-size: 11.5px; color: var(--ink-3); max-width: 90ch; }

/* ---------------- cortex ---------------- */
.cxpanel { padding: 0; overflow: hidden; background: #0a0a0f; border-color: #1d1d28; }
.cxwrap { position: relative; height: min(660px, 78vh); }
.cxwrap canvas { display: block; width: 100%; height: 100%; }
.cx-hud {
  position: absolute; top: 14px; left: 18px; pointer-events: none;
  font-family: "JetBrains Mono", monospace; font-size: 10.5px; line-height: 1.8;
  letter-spacing: 0.4px; color: #585c72; text-transform: uppercase;
}
.cx-hud b { color: #dde0ef; font-weight: 600; }
.cx-legend {
  position: absolute; bottom: 10px; left: 18px; right: 18px; pointer-events: none;
  font-family: "JetBrains Mono", monospace; font-size: 9.5px; letter-spacing: 0.3px;
  color: #4c5065; text-align: center;
}

260828-02","created_at":"2026-08-28","updated_at":"2026-08-29","occurrence":{"kind":"UNDERWAY","anchor_date":"2025-07-19","window":"construction 2025 \u2192 early 2030s; procurement and transmission-corridor decisions 2026-2028","label":"Construction launched (Motuo groundbreaking)"},"lane":"MACRO","title":"Tibet mega-dam: the largest infrastructure project on earth, unmapped","thesis":"China's Yarlung Tsangpo (Motuo) hydropower complex, launched July 2025 at a stated ~$167B scale, is a decade-long buildout with second-order chains in heavy construction, tunneling, HV transmission, and downstream water geopolitics (India/Bangladesh) that Western markets have barely priced anywhere.","why_now":"Construction formally launched mid-2025; procurement and transmission-corridor decisions land over 2026-2028, exactly the window where suppliers get contracted before earnings show it.","retail_gap":"Coverage treated it as a one-day China-politics headline. Almost no mapping of the supplier chain (tunnel boring, HV DC transmission, cement/steel logistics at altitude) or of the riparian-risk angle for Indian utilities and agriculture.","unmappedness":{"score":88,"rationale":"Event is known; its chain is essentially unmapped in Western coverage. Investability is the open question (largely Chinese SOEs), which is exactly what a chain build should establish."},"suggested_clock":"COMPOUNDER","horizon_years":[3,5],"evidence":[{"claim":"Groundbreaking of the Motuo hydropower project on the Yarlung Tsangpo was announced by Premier Li Qiang, with reported investment around 1.2 trillion yuan (~$167B) and five cascade stations.","source_name":"Reuters / Xinhua reporting on the July 2025 launch","source_date":"2025-07-19","tag":"INFERRED"},{"claim":"India publicly raised downstream-flow concerns; Arunachal/Assam riparian exposure is a live bilateral issue, creating a parallel Indian buffer-dam and monitoring response.","source_name":"Indian government statements and press coverage post-an e at the Maritime Congress of the Russian Far East (Vladivostok, 2026-05-28) to open year-round NSR navigation for 2026-2027; Sovcomflot's Q1 2026 revenue rose 60% YoY to $444M on Arctic/Yamal LNG shuttle operations, and an ice-class LNG carrier completed a rare early-summer NSR transit in June 2026 \u2014 the corridor is compounding on real cargo and revenue, not just diplomatic signaling.","retail_gap":"Western retail shipping/logistics coverage frames the NSR as a China-Russia geopolitical curiosity riding alongside the Red Sea and Panama Canal drought disruption stories; ice-class vessel construction, polar underwriting, and non-Russian Arctic-adjacent infrastructure and shipbuilding plays are absent from mainstream retail shipping narratives.","unmappedness":{"score":80,"rationale":"The climate/geopolitical occurrence has been reported for years and is not obscure, but almost no retail-accessible research maps who builds, insures, finances, or operates the vessels and infrastructure. The most visible operators (Rosatom, Sovcomflot) are sanctioned Russian SOEs, which pushes the actually investable set toward non-obvious names (Korean/Chinese ice-class shipbuilders, reinsurers, Arctic-adjacent non-Russian infrastructure) that a chain build must surface."},"suggested_clock":"COMPOUNDER","horizon_years":[3,5],"evidence":[{"claim":"Northern Sea Route transits hit a record 103 voyages carrying 3.2 million tonnes in 2025, up from 97 voyages in 2024, with China completing 14 container trips (+27%).","source_name":"The Arctic Institute / GlobalViewsWorld Arctic shipping reporting","source_date":"2026-08","tag":"INFERRED"},{"claim":"Rosatom (Rusatom Arctic) and Sovcomflot renewed a pledge at the Maritime Congress of the Russian Far East (Vladivostok) to establish year-round Northern Sea Route navigation starting the 2026-2027 season; Rosatom operates the world's only nuclear-icebreaker fleet (8 vessels in service, 4 under construction).","source_name":"High North News coverage of the Maritime Congress of the Russian Far East","source_date":"2026-05-28","tag":"INFERRED"},{"claim":"Sovcomflot's Q1 2026 revenue rose 60% YoY to $444M with a $94M profit, driven by ice-class LNG tanker service to the Yamal LNG project; the icebreaking LNG carrier Christophe de Margerie completed a rare early-summer NSR transit (Utrenniy terminal to the Bering Strait) in 13 days, departing 2026-05-26.","source_name":"gCaptain Sovcomflot Q1 2026 results and Arctic LNG transit reporting","source_date":"2026-05-26","tag":"INFERRED"}],"status":"NEW","chain_id":null,"review_by":"2026-11-29","notes":[],"confidence_audit":{"verified":0,"inferred":3,"speculative":0,"null":0},"changelog":[{"ts":"2026-08-29T00:00:00Z","by":"routine","change":"new signal card from weekday radar scan (MACRO lane)","prior":null}]},{"id":"SIG-20260829-02","created_at":"2026-08-29","updated_at":"2026-08-29","occurrence":{"kind":"UNDERWAY","anchor_date":"2025-07-01","window":"GLP-1 fill-finish/delivery-device capacity crunch intensifying since 2025, with the tightest dated evidence (BD $110M expansion, West/Stevanato guidance raises) from Jan-Jul 2026","label":"GLP-1 fill-finish/device capacity crunch"},"lane":"INDUSTRY","title":"GLP-1's picks-and-shovels: fill-finish and delivery-device capacity, not the molecules","thesis":"The GLP-1 obesity/diabetes story is retail-saturated at the molecule layer (Novo Nordisk, Eli Lilly), but the sterile fill-finish and delivery-device layer beneath it \u2014 prefilled syringes, glass and polymer cartridges, high-speed aseptic filling lines \u2014 is capacity-constrained for multiple years and structurally under-covered by retail, even as its public suppliers post accelerating GLP-1-linked growth and guidance raises.","why_now":"West Pharmaceutical's Q1 2026 organic revenue grew 15% and it raised FY2026 guidance (EPS to $8.85-$9.05, sales to $3.345-3.380B) on GLP-1 and High Value Products strength; Stevanato Group's Q1 2026 revenue grew ~10% constant-currency with GLP-1 now ~21-22% of total revenue; BD announced a $110M investment (2026-01) to expand prefillable-syringe production for GLP-1 delivery, supply beginning mid-2026; OEM filling-line order books for premium aseptic systems now extend into 2027-2028 on 18-36 month lead times \u2014 the physical bottleneck is getting tighter exactly as GLP-1 volumes are set to keep compounding through the horizon.","retail_gap":"Retail attention and trading volume on the GLP-1 trade concentrate almost entirely on NVO and LLY; the device/fill-finish layer (West Pharmaceutical, Stevanato, SCHOTT, Syntegon, Daikyo) rarely appears in retail GLP-1 commentary despite being the physical constraint on how many doses can actually ship, and despite being where per-unit economics of the delivery format (syringe vs. cartridge vs. pen) get decided.","unmappedness":{"score":55,"rationale":"The layer is already followed by pharma-sector sell-side (Stevanato trades near 30x P/E per an Aug 2026 valuation note), so it is not undiscovered to specialists \u2014 but it is essentially invisible to the retail investors who own the GLP-1 story via NVO/LLY, and the finer chain question (which sub-component \u2014 glass barrels, polymer cartridges, or filling-line OEMs \u2014 captures margin as capacity is built out) remains unmapped for a generalist audience."},"suggested_clock":"COMPOUNDER","horizon_years":[2,4],"evidence":[{"claim":"West Pharmaceutical's Q1 2026 organic revenue grew 15%, driven by double-digit growth in both GLP-1 and non-GLP-1 High Value Products Components; the company subsequently raised FY2026 adjusted EPS guidance to $8.85-$9.05 (from $8.40-$8.75) and sales guidance to $3.345-3.380B (from $3.29-3.35B).","source_name":"Benzinga / Investing.com coverage of West Pharmaceutical Q1-Q2 2026 earnings","source_date":"2026-07","tag":"INFERRED"},{"claim":"Stevanato Group reported ~10% constant-currency revenue growth in Q1 2026, with GLP-1 therapies now representing approximately 21-22% of total company revenue; the stock trades near a 30x P/E amid analyst concern about GLP-1 revenue concentration as capacity expansions mature.","source_name":"Investing.com / Simply Wall St coverage of Stevanato Group Q1 2026 results","source_date":"2026-05","tag":"INFERRED"},{"claim":"BD announced a $110M investment (January 2026) to expand production of prefillable syringes for biologic and GLP-1 drug delivery, with new supply beginning mid-2026; industry-wide, prefilled-syringe and autoinjector cartridge filling-line procurement lead times run 18-36 months for premium aseptic systems, with OEM order books extending into 2027-2028.","source_name":"IntuitionLabs / fill-finish manufacturing market reporting","source_date":"2026-01","tag":"INFERRED"}],"status":"NEW","chain_id":null,"review_by":"2026-11-29","notes":[],"confidence_audit":{"verified":0,"inferred":3,"speculative":0,"null":0},"changelog":[{"ts":"2026-08-29T00:00:00Z","by":"routine","change":"new signal card from weekday radar scan (INDUSTRY lane)","prior":null}]},{"id":"SIG-20260829-03","created_at":"2026-08-29","updated_at":"2026-08-29","occurrence":{"kind":"UNDERWAY","anchor_date":"2026-02-01","window":"humanoid robots crossed the pilot-to-commercial-volume threshold in early 2026; harmonic-drive/actuator supply named the binding constraint through mid-2026","label":"Humanoid robot volume-production crossing"},"lane":"USE_CASE","title":"Humanoid robots are the retail story; harmonic-drive/actuator supply is not","thesis":"Humanoid robot deployment crossed from pilot to real commercial volume in 2026 (Figure at BMW Spartanburg, 1,000+ Optimus units at Tesla, Agility's Digit at Amazon/Toyota, Apptronik's Apollo at Mercedes, Unitree shipping ~5,500 units in 2025) \u2014 a use case retail already prices through Tesla and thematic robotics ETFs. The link that actually gates how fast this scales \u2014 harmonic-drive/strain-wave gearboxes and integrated actuator modules, concentrated among a handful of Japanese and Chinese makers with structurally limited scale-up \u2014 is barely represented in retail portfolios despite fresh, quantifiable order-book evidence that it is the binding constraint.","why_now":"Harmonic-drive lead times run 26+ weeks and the components are described as structurally harder to scale than electronics because of precision-manufacturing limits; Harmonic Drive Systems (Tokyo: 6324) reported FY2026/3 full-year orders up 16.2% to \u00a561.6B with backlog up 13.6% to \u00a521.9B, explicitly citing industrial-robot, semiconductor-equipment, and emerging AI-robot demand, and guided FY2027/3 operating income to more than double (+141.5%); Chinese challenger Leaderdrive grew FY2025 revenue 47.3% to \u00a5571M as humanoid programs scale procurement.","retail_gap":"Retail humanoid exposure runs almost entirely through Tesla (Optimus) and thematic robotics ETFs holding household names; the actual gating suppliers (Harmonic Drive Systems, Nabtesco, Leaderdrive) sit at low single-digit weights inside niche thematic funds (e.g., ~2% each in KOID) and are essentially absent from mainstream retail discussion despite being named the structural bottleneck by industry researchers.","unmappedness":{"score":65,"rationale":"The humanoid-robot theme itself is fully discovered and already anchors method \u00a73's 85+ 'GPU-class retail story' band \u2014 not unmapped. The actuator/gearbox link specifically is thinly held, now backed by fresh, dated order-book data showing it tightening in real time, and has not yet become a retail talking point: a genuine crowdedness gap sitting inside an otherwise crowded chain."},"suggested_clock":"COMPOUNDER","horizon_years":[2,5],"evidence":[{"claim":"Figure's humanoids have contributed to production of 30,000+ vehicles at BMW's Spartanburg plant running ten-hour shifts five days a week; Tesla has 1,000+ Optimus Gen 3 units working across its facilities on battery assembly and cable routing; Unitree shipped roughly 5,500 huma 4 previously ~25% of world seaborne oil and ~20% of global LNG \u2014 producing what analysts call the largest, most durable oil-market disruption in memory. Six months on, the war and the oil price are the most heavily covered macro story on earth, but the chain beneath it \u2014 Cape-of-Good-Hope tanker rerouting economics, marine war-risk (re)insurance repricing, a Somali-piracy resurgence exploiting stretched naval patrols, and a broader Gulf-security-architecture reshuffle \u2014 sits mostly in trade press, not mainstream financial coverage.","why_now":"At the six-month mark (per Washington Post/CSIS reporting, 2026-08-27) there is still no off-ramp; war-risk marine insurance premiums for Hormuz/Persian Gulf transits have spiked >1,000% (from ~0.15-0.25% to 7.5-10% of vessel value per voyage) and the Joint War Committee widened its war-risk zones in March 2026 to cover Bahrain, Djibouti, Kuwait, Oman, Qatar and the Somali/Pakistani coastlines; Somali pirates hijacked three tankers (MT Honour 25, MT Eureka, MT Asana) between April-July 2026 as ships reroute around Africa and naval patrols are stretched thin across two simultaneous shipping crises (Hormuz + the pre-existing Red Sea/Houthi situation).","retail_gap":"Mainstream and retail coverage tracks the war itself and the headline oil price; the tanker-rerouting / marine-war-risk-insurance / piracy-security layer beneath it is covered mainly in energy and insurance trade press (OilPrice, Insurance Business, Insurance Journal, TFTC), rarely reaching general financial media or retail portfolios.","unmappedness":{"score":75,"rationale":"The occurrence is maximally known \u2014 a live war and a closed strait have been the dominant headline for six months, the opposite of obscure. What is unmapped is the specific investable chain underneath it: which insurers/reinsurers are capturing the repriced war risk, which tanker owners capture the ton-mile inflation from Cape rerouting, and who supplies the private maritime <script>
/* Upstream SPA v2 — vanilla JS over window.UPSTREAM_DATA. Hash-routed, no external libs. */
(function () {
  "use strict";
  var D = window.UPSTREAM_DATA || {};
  var app = document.getElementById("app");
  var TODAY = (D.built_at || new Date().toISOString()).slice(0, 10);

  /* ---------------- helpers ---------------- */
  function esc(s) {
    if (s === null || s === undefined) return "";
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function byId(list, id) { for (var i = 0; i < (list || []).length; i++) if (list[i].id === id) return list[i]; return null; }
  function daysBetween(a, b) { return Math.round((new Date(b) - new Date(a)) / 86400000); }
  function staleChip(asOf) {
    if (!asOf) return "";
    var d = daysBetween(asOf, TODAY);
    if (d > 90) return '<span class="chip verystale">stale · ' + esc(asOf) + "</span>";
    if (d > 30) return '<span class="chip stale">stale · ' + esc(asOf) + "</span>";
    return "";
  }
  function chip(text, cls) { return '<span class="chip ' + esc(cls || "neutral") + '">' + esc(text) + "</span>"; }
  function tierChip(t) { return t ? '<span class="chip tier">' + esc(t) + "</span>" : ""; }
  function verdColor(v) { return { UNDISCOVERED: "var(--und)", EMERGING: "var(--emg)", CROWDED: "var(--crd)", OVER_CROWDED: "var(--ovr)" }[v] || "var(--border-strong)"; }
  function marketFor(t) { return (D.market || {})[String(t).replace(/\./g, "-")] || (D.market || {})[t] || null; }
  function fmtMoney(x) { return typeof x === "number" ? x.toLocaleString("en-US", { maximumFractionDigits: 2 }) : esc(x); }
  function seclabel(t) { return '<div class="seclabel">' + esc(t) + "</div>"; }

  /* ---------------- click queue (artifact capability) ----------------
     A Run click publishes a new version of this page with the command queued
     in the #upstream-queue block. Any live Claude session watching the
     artifact is notified, executes the command against the repo, and
     republishes the page with the results baked in. Where queueing is
     unavailable (local preview, read-only viewer) the button degrades to a
     copy affordance automatically. */
  var QUEUE = { v: 1, queue: [] };
  try { QUEUE = JSON.parse(document.getElementById("upstream-queue").textContent) || QUEUE; } catch (e) {}
  var QSTATE = { readonly: false, busy: false };
  var SCRIPT_END = "</scr" + "ipt>";
  function canQueue() { return !!(window.claude && typeof window.claude.use === "function") && !QSTATE.readonly; }
  function isQueued(cmd) { return (QUEUE.queue || []).some(function (q) { return q.cmd === cmd; }); }
  function toast(msg, ms) {
    var t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, ms || 5600);
  }
  function fetchSelfSource() {
    function ok(r) { return r.ok ? r.text() : Promise.reject(new Error("HTTP " + r.status)); }
    return fetch("index.html", { cache: "no-store" }).then(ok)
      .catch(function () { return fetch(location.href.split("#")[0], { cache: "no-store" }).then(ok); })
      .then(function (src) {
        if (src.indexOf('id="upstream-queue"') < 0) throw new Error("queue block not found in source");
        return src;
      });
  }
  function replaceQueueBlock(src, queueObj) {
    var open = src.indexOf('id="upstream-queue"');
    var start = src.indexOf(">", open) + 1;
    var end = src.indexOf(SCRIPT_END, start);
    return src.slice(0, start) + JSON.stringify(queueObj).replace(/<\//g, "<\\/") + src.slice(end);
  }
  function enqueue(cmd, btn) {
    if (QSTATE.busy) return;
    QSTATE.busy = true;
    if (btn) { btn.disabled = true; btn.textContent = "Queuing…"; }
    var fail = function (msg, permanent) {
      QSTATE.busy = false;
      if (permanent) QSTATE.readonly = true;
      toast(msg, 6500);
      route();
    };
    if (!canQueue()) return fail("Queueing unavailable in this view — copy the command into a Claude session instead.", false);
    window.claude.use("artifact").then(function (ns) {
      if (!ns) return fail("This view cannot queue — copy the command into a Claude session instead.", true);
      return fetchSelfSource().then(function (src) {
        var cur = { v: 1, queue: [] };
        try {
          var o = src.indexOf('id="upstream-queue"');
          var s = src.indexOf(">", o) + 1;
          cur = JSON.parse(src.slice(s, src.indexOf(SCRIPT_END, s))) || cur;
        } catch (e) {}
        if ((cur.queue || []).some(function (q) { return q.cmd === cmd; })) {
          QSTATE.busy = false; QUEUE = cur; toast("Already queued: " + cmd); route(); return;
        }
        cur.queue = (cur.queue || []).concat([{ id: "q-" + Date.now(), cmd: cmd, ts: new Date().toISOString() }]);
        try { sessionStorage.setItem("upstream.justQueued", cmd); } catch (e) {}
        return ns.publish(replaceQueueBlock(src, cur)).catch(function (err) {
          try { sessionStorage.removeItem("upstream.justQueued"); } catch (e) {}
          var code = (err && err.code) || "upstream_error";
          if (code === "conflict") { QSTATE.busy = false; return; } // view reloads to the winner; re-click there
          if (code === "not_writer" || code === "not_granted" || code === "not_declared" ||
              code === "capability_disabled" || code === "capability_removed")
            return fail("This view is read-only — buttons switched to copy mode.", true);
          if (code === "rate_limited") return fail("Queueing too fast — wait a minute and try again.", false);
          return fail("Queueing failed (" + code + ") — use copy this time.", false);
        });
      });
    }).catch(function () { fail("Queueing unavailable — use copy instead.", false); });
  }
  var RUN_LABELS = [
    [/^run chain /, "Build chain"], [/^run heat /, "Score heat map"], [/^run scenarios /, "Write scenarios"],
    [/^run screen /, "Screen stocks"], [/^run deepdive /, "Run deep dive"], [/^run redteam /, "Red-team it"],
    [/^request data /, "Fetch data"], [/^refresh /, "Update"], [/^run radar/, "Run radar"], [/^run digest/, "Build digest"],
  ];
  function runLabel(cmd) {
    for (var i = 0; i < RUN_LABELS.length; i++) if (RUN_LABELS[i][0].test(cmd)) return RUN_LABELS[i][1];
    return "Run";
  }
  function cmdline(cmd) {
    return '<span class="cmdline"><code>' + esc(cmd) + '</code><button data-copy="' + esc(cmd) + '" title="copy command">copy</button></span>';
  }
  function runButton(cmd, caption, opts) {
    opts = opts || {};
    if (isQueued(cmd)) {
      if (opts.compact) return '<button class="btn-run q" disabled>Queued ✓</button>';
      return '<div class="runwrap"><button class="btn-run q" disabled>Queued ✓</button>' +
        '<span class="cmdline">waiting for a live Claude session · ' + cmdline(cmd) + "</span></div>";
    }
    var btn = canQueue()
      ? '<button class="btn-run" data-run="' + esc(cmd) + '">' + esc(runLabel(cmd)) + "</button>"
      : '<button class="btn-run" data-copyrun="' + esc(cmd) + '">' + esc(runLabel(cmd)) + (opts.compact ? "" : " — copy") + "</button>";
    if (opts.compact) return btn;
    return '<div class="runwrap">' + btn +
      '<span class="cmdline">' + esc(caption || (canQueue() ? "runs in a live Claude session; results land on this page" : "copies the command — paste into a Claude session on this repo")) +
      " · " + cmdline(cmd) + "</span></div>";
  }

  /* ---------------- shell ---------------- */
  function pendingCount() {
    return ((D.requests || {}).requests || []).filter(function (x) { return x.status === "PENDING"; }).length;
  }
  function failedCount() {
    return ((D.requests || {}).requests || []).filter(function (x) { return x.status === "FAILED"; }).length;
  }
  function healthState() {

  /* ---------------- what changed ---------------- */

  function sigTitle(id) { var s = byId(D.signals, id); return s ? s.title : id; }

  function heatTab(c, links, scored) {

      s += '<text x="' + (P.l - 12) + '" y="' + (Y(v) + 3) + '" text-anchor="end" font-size="10" class="mono-t" fill="var(--chart-axis)">' + v + "</text>";
    });
    s += '<line x1="' + X(60) + '" y1="' + P.t + '" x2="' + X(60) + '" y2="' + (H - P.b) + '" stroke="var(--chart-axis)" stroke-dasharray="3 5"/>';
    s += '<line x1="' + P.l + '" y1="' + Y(40) + '" x2="' + (W - P.r) + '" y2="' + Y(40) + '" stroke="var(--chart-axis)" stroke-dasharray="3 5"/>';

    var placed = [];
    function labelSpot(x, yCands, name) {
      var w = name.length * 5.6;

        var y = yCands[ci];
        if (y < P.t + 10 || y > H - P.b - 4) continue;
        var hit = placed.some(function (p) { return Math.abs(p.y - y) < 13 && (Math.abs(p.x - x) < (p.w + w) / 2 + 6); });
        if (!hit) { placed.push({ x: x, y: y, w: w }); return y; }
      }
      var y2 = yCands[yCands.length - 1];
      placed.push({ x: x, y: y2, w: w });

      s += '<text x="' + X(im) + '" y="' + ly + '" text-anchor="middle" font-size="10.5" font-weight="600" fill="var(--ink)">' + esc(nm) + "</text>";
    });

    var un = links.filter(function (l) { return !l.heat || !l.heat.crowdedness || l.heat.crowdedness.score == null; });

  function priceChart(mk, st) {
    if (!mk || !mk.series || !(mk.series.rows || []).length) {
      return '<div class="emptystate">No price series yet.<div class="runwrap">' + runButton("request data " + st.ticker, "the fetch workflow fills data/market in ~5 minutes") + "</div></div>";
    }
    var rows = mk.series.rows;
    var step = Math.max(1, Math.floor(rows.length / 420));
    var pts = rows.filter(function (_, i) { return i % step === 0 || i === rows.length - 1; });
    var W = 940, H = 360, P = { l: 52, r: 76, t: 30, b: 34 };
    var iw = W - P.l - P.r, ih = H - P.t - P.b;
    var vals = pts.map(function (r) { return r[1]; });
    var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
    if (st.entry_zone) { lo = Math.min(lo, st.entry_zone.low); hi = Math.max(hi, st.no_entry_above || hi); }
    var pad = (hi - lo) * 0.07; lo -= pad; hi += pad;
    function X(i) { return P.l + (i / (pts.length - 1)) * iw; }
    function Y(v) { return P.t + (1 - (v - lo) / (hi - lo)) * ih; }
    var s = '<div class="chartwrap"><svg id="pxchart" viewBox="0 0 ' + W + " " + H + '" width="100%" style="max-width:' + W + 'px" role="img" aria-label="price chart">';
    if (st.entry_zone) s += '<rect x="' + P.l + '" y="' + Y(st.entry_zone.high) + '" width="' + iw + '" height="' + (Y(st.entry_zone.low) - Y(st.entry_zone.high)) + '" fill="var(--band-good)"/><text x="' + (P.l + 8) + '" y="' + (Y(st.entry_zone.high) + 14) + '" font-size="10" font-weight="600" fill="var(--und)">ENTRY ZONE</text>';
    if (st.no_entry_above) s += '<rect x="' + P.l + '" y="' + P.t + '" width="' + iw + '" height="' + Math.max(0, Y(st.no_entry_above) - P.t) + '" fill="var(--band-bad)"/><text x="' + (P.l + 8) + '" y="' + (P.t + 14) + '" font-size="10" font-weight="600" fill="var(--ovr)">NO ENTRY</text>';
    for (var t = 0; t <= 4; t++) {
      var v = lo + ((hi - lo) * t) / 4;
      s += '<line x1="' + P.l + '" y1="' + Y(v) + '" x2="' + (W - P.r) + '" y2="' + Y(v) + '" stroke="var(--chart-grid)"/>';
      s += '<text x="' + (P.l - 8) + '" y="' + (Y(v) + 3) + '" text-anchor="end" font-size="10" class="mono-t" fill="var(--chart-axis)">' + v.toFixed(0) + "</text>";
    }
    var lbl = Math.max(1, Math.floor(pts.length / 6));
    pts.forEach(function (r, i) { if (i % lbl === 0 && i < pts.length - 3) s += '<text x="' + X(i) + '" y="' + (H - P.b + 16) + '" text-anchor="middle" font-size="9.5" class="mono-t" fill="var(--chart-axis)">' + esc(r[0].slice(0, 7)) + "</text>"; });
    (st.events || []).forEach(function (e, ei) {
      var idx = -1;
      pts.forEach(function (r, i) { if (idx < 0 && r[0] >= e.date) idx = i; });
      if (idx < 0) return;
      var lyy = ei % 2 === 0 ? P.t - 6 : P.t - 18;
      s += '<line x1="' + X(idx) + '" y1="' + (P.t - 2) + '" x2="' + X(idx) + '" y2="' + (H - P.b) + '" stroke="var(--chart-axis)" stroke-dasharray="2 4"/>' +
        '<text x="' + X(idx) + '" y="' + lyy + '" text-anchor="middle" font-size="9" fill="var(--ink-3)">' + esc(e.label.length > 26 ? e.label.slice(0, 25) + "…" : e.label) + "</text>";
    });
    var path = pts.map(function (r, i) { return (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(r[1]).toFixed(1); }).join("");
    s += '<path d="' + path + '" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>';
    var last = pts[pts.length - 1];
    s += '<circle cx="' + X(pts.length - 1) + '" cy="' + Y(last[1]) + '" r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>';
    s += '<text x="' + (X(pts.length - 1) + 9) + '" y="' + (Y(last[1]) + 4) + '" font-size="11.5" font-weight="650" class="mono-t" fill="var(--ink)">' + last[1] + "</text>";
    s += '<rect id="pxhover" x="' + P.l + '" y="' + P.t + '" width="' + iw + '" height="' + ih + '" fill="transparent"/>';
    s += "</svg></div>";
    s += '<div class="muted num" style="margin-top:8px">prices [' + esc(mk.series.source) + ", as of " + esc(mk.series.as_of) + "] · " + esc(mk.price_status) +
      (mk.price_status === "DISPUTED" ? " — both prints kept in data/market, never averaged" : "") + "</div>";
    window.__px = { pts: pts, X: X, Y: Y, P: P, W: W };
    return s;
  }

    return '<div class="scrim" data-closedrawer></div><div class="drawer" role="dialog" aria-label="' + esc(obj.title) + '"><button class="x" data-closedrawer>✕</button>' +
      '<div class="row">' + chip(isEvt ? obj.kind : obj.family) + chip(obj.date, "neutral") + chip(obj.status) + "</div>" +
      "<h2>" + esc(obj.title) + "</h2>" +
      "<p class='small'>" + esc(isEvt ? obj.why_it_matters : obj.why) + "</p>" +
      "<div class='muted small'>[" + esc(obj.source_name) + (obj.source_date ? ", " + esc(obj.source_date) : "") + "]" + (obj.window ? " · " + esc(obj.window) : "") + "</div>" +
      "<div style='margin-top:16px'>" + runButton("run radar", "the radar run judges promotion to a full signal card (method §0.1)") + "</div>" +
      "</div>";
  }

  /* ---------------- shared blocks ---------------- */
  function notesBlock(obj) {
    var n = obj.notes || [];
    return seclabel("Notes") + (n.length ? n.map(function (x) {
      return '<div class="note"><span class="who">' + esc(x.by) + " · " + esc((x.ts || "").slice(0, 10)) + "</span><br>" + esc(x.text) + "</div>";
    }).join("") : '<div class="muted">None — add one from any session: <span class="mono">note ' + esc(obj.id || obj.ticker || "") + ' "…"</span></div>');
  }
  function changelogBlock(obj) {
    var c = (obj.changelog || []).slice().reverse();
    if (!c.length) return "";
    return seclabel("History") + "<div class='timeline'>" + c.map(function (x) {
      return '<div class="t"><span class="when">' + esc((x.ts || "").slice(0, 10)) + " · " + esc(x.by) + "</span><br>" + esc(x.change) + (x.prior ? " <span class='muted'>(was: " + esc(x.prior) + ")</span>" : "") + "</div>";
    }).join("") + "</div>";
  }
  function notFound(what) {
    return topbar() + "<main><div class='emptystate' style='margin-top:40px'>Not found: " + esc(what) + '<br><br><a href="#/">back to radar</a></div>' + footer() + "</main>";
  }

  /* ---------------- router & events ---------------- */
  function route() {
    var h = location.hash || "#/";
    var p = h.replace(/^#\//, "").split("/").map(decodeURIComponent);
    var html;
    if (!p[0]) html = homeView();
    else if (p[0] === "signal") html = signalView(p[1]);
    else if (p[0] === "chains") html = chainsView();
    else if (p[0] === "chain") html = chainView(p[1], p[2]);
    else if (p[0] === "screen") html = screenView(p[1], p[2]);
    else if (p[0] === "stock") html = stockView(p[1], p[2]);
    else if (p[0] === "cortex") html = cortexView();
    else if (p[0] === "book") html = bookView();
    else if (p[0] === "shadow") html = shadowView();
    else html = homeView();
    app.innerHTML = html;
    window.scrollTo(0, 0);
    wire();
  }
  function bindCopy(scope) {
    scope.querySelectorAll("[data-copy]").forEach(function (b) {
      b.addEventListener("click", function (e) {
        e.preventDefault(); e.stopPropagation();
        var txt = b.getAttribute("data-copy");
        function done() { b.textContent = "copied"; setTimeout(function () { b.textContent = "copy"; }, 1400); }
        try { navigator.clipboard.writeText(txt).then(done, function () { fallbackCopy(txt); done(); }); }
        catch (err) { fallbackCopy(txt); done(); }
      });
    });
  }
  function wire() {
    bindCopy(app);
    app.querySelectorAll("[data-run]").forEach(function (b) {
      b.addEventListener("click", function (e) {
        e.preventDefault(); e.stopPropagation();
        enqueue(b.getAttribute("data-run"), b);
      });
    });
    app.querySelectorAll("[data-copyrun]").forEach(function (b) {
      b.addEventListener("click", function (e) {
        e.preventDefault(); e.stopPropagation();
        var cmd = b.getAttribute("data-copyrun");
        try { navigator.clipboard.writeText(cmd); } catch (err) { fallbackCopy(cmd); }
        b.textContent = "Copied ✓ — paste into a Claude session";
        setTimeout(function () { b.textContent = runLabel(cmd) + " — copy"; }, 2600);
      });
    });
    app.querySelectorAll("[data-stop]").forEach(function (n) {
      n.addEventListener("click", function (e) { e.stopPropagation(); });
    });
    app.querySelectorAll("[data-nav]").forEach(function (n) {
      n.addEventListener("click", function () { location.hash = n.getAttribute("data-nav"); });
      n.addEventListener("keydown", function (e) { if (e.key === "Enter") location.hash = n.getAttribute("data-nav"); });
    });
    app.querySelectorAll("[data-tab]").forEach(function (b) {
      b.addEventListener("click", function () { location.hash = "#/chain/" + b.getAttribute("data-chain") + "/" + b.getAttribute("data-tab"); });
    });
    app.querySelectorAll("[data-drawer]").forEach(function (n) {
      function open() {
        var chainId = (location.hash.split("/")[2] || "");
        var c = byId(D.chains, chainId);
        var l = c && byId(c.links, n.getAttribute("data-drawer"));
        if (!l) return;
        var host = document.getElementById("drawerHost");
        host.innerHTML = drawer(c, l);
        host.querySelectorAll("[data-closedrawer]").forEach(function (x) {
          x.addEventListener("click", function () { host.innerHTML = ""; });
        });
        bindCopy(host);
        host.querySelectorAll("[data-run]").forEach(function (b) {
          b.addEventListener("click", function (e) { e.preventDefault(); enqueue(b.getAttribute("data-run"), b); });
        });
      }
      n.addEventListener("click", open);
      n.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); } });
    });
    if (document.getElementById("cortexCanvas")) initCortex();
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") { var host = document.getElementById("drawerHost"); if (host) host.innerHTML = ""; }
    });
    var tb = document.getElementById("themeBtn");
    if (tb) tb.addEventListener("click", cycleTheme);
    var hov = document.getElementById("pxhover");
    if (hov && window.__px) {
      var tip = document.createElement("div"); tip.className = "tooltip"; tip.style.display = "none"; document.body.appendChild(tip);
      var svg = document.getElementById("pxchart");
      hov.addEventListener("mousemove", function (e) {
        var r = svg.getBoundingClientRect();
        var sx = ((e.clientX - r.left) / r.width) * window.__px.W;
        var px = window.__px;
        var i = Math.round(((sx - px.P.l) / (px.W - px.P.l - px.P.r)) * (px.pts.length - 1));
        i = Math.max(0, Math.min(px.pts.length - 1, i));
        var pt = px.pts[i];
        tip.innerHTML = "<span class='num'>" + esc(pt[0]) + " · " + pt[1] + "</span>";
        tip.style.display = "block"; tip.style.left = e.clientX + 14 + "px"; tip.style.top = e.clientY - 12 + "px";
      });
      hov.addEventListener("mouseleave", function () { tip.style.display = "none"; });
    }
  }
  function fallbackCopy(txt) {
    var ta = document.createElement("textarea"); ta.value = txt; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
  }
  function cycleTheme() {
    var cur = document.documentElement.getAttribute("data-theme") || "auto";
    var next = cur === "auto" ? "dark" : cur === "dark" ? "light" : "auto";
    if (next === "auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem("upstream.theme", next); } catch (e) {}
  }
  try {
    var saved = localStorage.getItem("upstream.theme");
    if (saved && saved !== "auto") document.documentElement.setAttribute("data-theme", saved);
  } catch (e) {}

  window.addEventListener("hashchange", route);
  route();
  try {
    var jq = sessionStorage.getItem("upstream.justQueued");
    if (jq) {
      sessionStorage.removeItem("upstream.justQueued");
      toast("Queued: " + jq + " — a live Claude session runs it and this page refreshes with the result.");
    }
  } catch (e) {}
  setTimeout(stampVisit, 4000);
})();

</script>
