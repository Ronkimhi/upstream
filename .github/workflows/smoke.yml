# Weekly liveness check of every external source + the radar staleness
# sentinel. Loud issue on breakage — a dead API must never read as "quiet".
name: smoke
on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install deps
        run: pip install --quiet requests pandas yfinance pytrends
      - name: probes
        run: python3 tools/fetch/smoke_probe.py
      - name: commit health
        if: always()
        run: |
          git config user.name upstream-bot
          git config user.email actions@users.noreply.github.com
          git add data/health/actions.json
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "[smoke] $(date -u +%F)"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase && continue
            sleep $((i * 7))
          done
          exit 1
      - name: loud failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "smoke FAILED $(date -u +%F)" \
            --body "A required data source probe failed (or the radar routine has gone silent). See the probe table in the run log and data/health/actions.json.
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
