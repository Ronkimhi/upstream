# Data + UI integrity gate: any push that touches data/, app/ or tools/ must leave
# valid JSON and a buildable page, whichever venue wrote it. No secrets.
name: ci
on:
  push:
    paths: ["data/**", "app/**", "tools/**"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # build --check now also compares the COMMITTED app/index.html against a fresh
      # payload built from data/. Before 2026-08-29 it assembled the page in memory and
      # discarded it, so a stale or hand-edited artifact passed CI silently — and the
      # artifact is what actually gets read.
      - name: validate + build check
        run: python3 app/build.py --check
      # tools/tests/test_pressure.py exercises acis/dual_source.py, which imports requests.
      # Without it the whole test module fails to import and the suite reports one error
      # instead of running -- a red CI that says nothing about the code.
      - name: test deps
        run: pip install --quiet requests
      - name: unit tests
        run: python3 -m unittest discover -s tools/tests -q
      - name: campaign screen identity tests
        run: python3 -m unittest tools.tests.test_screen_identity -q
      # Structural gates that hold rules no schema can express. They are cheap, offline,
      # and each one exists because the rule it enforces was previously prose that a
      # session could honour or forget.
      - name: renderer lint
        run: python3 tools/check_render.py
      - name: screen gate (verbatim earnings quotes)
        run: python3 tools/check_screen.py
      # Each campaign gate returns success before its store exists, then blocks malformed
      # campaign data. Separate steps keep their examined denominators visible in CI.
      - name: issuer universe gate
        run: python3 tools/check_map.py
      - name: reusable profile gate
        run: python3 tools/check_profile.py
      - name: ten-theme campaign gate
        run: python3 tools/check_campaign.py
      - name: impact appraisal gate
        run: python3 tools/check_impact.py
      # The citation bar went from warning to error on 2026-08-30, once the seed corpus
      # reached 0 uncited links. A gate that only runs in a session's postlude holds only
      # for sessions that remember to run it.
      - name: chain gate (structure and the citation bar)
        run: python3 tools/check_chain.py
      # The occurrence log is append-only and its clustering is recomputed, so both
      # properties are only real if something re-derives them from disk on every push.
      - name: occurrence log and theme gate
        run: python3 tools/check_themes.py
      # Ember's gates are migration-compatible for old seed heat and scenarios. A new
      # campaign-era write binds its evidence, health, ledger, and calibration hard.
      - name: heat gate
        run: python3 tools/check_heat.py
      - name: scenario gate
        run: python3 tools/check_scenarios.py
      # The machine audit: whether this repo's own rules are enforced or merely written
      # down. Advisory like the citation-debt line below, and for the same reason: the
      # day-one backlog is real, and a gate that fails from its first run is one people
      # route around. It runs in CI rather than only as a Stop hook because a hook can be
      # switched off from inside a session and a CI step cannot.
      - name: machine audit (advisory)
        run: python3 tools/check_machine.py
      # The model-tier gate: whether commands actually ran on the tier tasks/lessons.md
      # requires. Advisory for the same reason as the machine audit above -- zero ledger
      # lines carry `model:` on day one.
      - name: model tier (advisory)
        run: python3 tools/check_model.py
      # Citation debt, reported but not blocking. It hardens to an error once the seed
      # corpus is backfilled; until then the number is printed every run so the backlog
      # stays visible instead of becoming invisible.
      - name: citation debt (advisory)
        run: python3 tools/validate.py 2>&1 | grep -E "citation debt" | head -20 || true

