# Data + UI integrity gate, plus the two-person reconciliation.
#
# `validate` : any push touching data/ or app/ must leave valid JSON and a buildable page,
#              whichever venue wrote it.
# `collab`   : the ONLY control in this repo that a session cannot switch off from the inside.
#              Branch protection is unavailable on this plan (the API returns 403 "Upgrade to
#              GitHub Pro or make this repository public"), so nothing can refuse a push. This
#              job reconciles each commit's DECLARED actor against `github.actor`, the OAuth
#              identity of the credential that pushed, which no session holds, and shouts.
#
# Known and accepted blind spot: a push that disables this workflow runs the disabled workflow.
# `.github/**` is CONSTITUTION-tier and the backstop for that case is the session brief and
# `check health`, not this file.
#
# No secrets beyond GITHUB_TOKEN.
name: ci
on:
  push:
    paths:
      - "data/**"
      - "app/**"
      - "tools/**"
      - "docs/**"
      - ".claude/**"
      - ".github/**"
      - "CLAUDE.md"
      - "README.md"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # build --check now also compares the COMMITTED app/index.html against a fresh
      # payload built from data/. Before 2026-08-29 it assembled the page in memory and
      # discarded it, so a stale or hand-edited artifact passed CI silently — and the
      # artifact is what actually gets read.
      - name: validate + build check
        run: python3 app/build.py --check
      - name: unit tests
        run: python3 -m unittest discover -s tools/tests -q
      # Structural gates that hold rules no schema can express. They are cheap, offline,
      # and each one exists because the rule it enforces was previously prose that a
      # session could honour or forget.
      - name: renderer lint
        run: python3 tools/check_render.py
      - name: screen gate (verbatim earnings quotes)
        run: python3 tools/check_screen.py
      # Citation and actor debt, reported but not blocking. Both harden to errors once the
      # seed corpus is backfilled; until then the number is printed every run so the
      # backlog stays visible instead of becoming invisible.
      - name: citation and actor debt (advisory)
        run: python3 tools/validate.py --strict-actors 2>&1 | grep -E "citation debt|names an agent with no actor" | head -20 || true

  collab:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      # Full history: the range walk needs both ends of the push, and a shallow clone
      # would silently reconcile nothing and pass.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Context values go through env, never interpolated into the shell body: `${{ }}` in a
      # `run:` is the standard Actions injection sink, and github.actor is attacker-adjacent
      # by definition here (it is the thing being reconciled).
      - name: reconcile declared actor against the pushing account
        id: collab
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          PUSHER: ${{ github.actor }}
        run: |
          BEFORE="$BEFORE_SHA"
          # A new branch or a force-push reports an all-zero "before"; fall back to the
          # single head commit rather than walking all of history.
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            RANGE="$HEAD_SHA~1..$HEAD_SHA"
          else
            RANGE="$BEFORE..$HEAD_SHA"
          fi
          echo "range=$RANGE" >> "$GITHUB_OUTPUT"
          python3 tools/check_collab.py --range "$RANGE" --pusher "$PUSHER" \
            | tee collab-report.txt
      - name: open an issue naming the violation
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          PUSHER: ${{ github.actor }}
          RANGE: ${{ steps.collab.outputs.range }}
        run: |
          gh issue create \
            --title "collab: out-of-lane change $(date -u +%F) ($PUSHER)" \
            --body "\`tools/check_collab.py\` found a tier or identity violation in the push
          \`$RANGE\` by **$PUSHER**.

          \`\`\`
          $(cat collab-report.txt 2>/dev/null | tail -40)
          \`\`\`

          The map is \`python3 tools/check_collab.py --tiers\`. CONSTITUTION-tier changes are
          Ron's; agent contracts need an adversary review (\`data/proposals/PROP-*.json\`).

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
