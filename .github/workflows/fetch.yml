# Upstream data plane. Deterministic Python only — Claude never runs here.
# Triggers: session-committed data/requests.json (the bridge), weekday cron
# (refresh + indicators + shadow sweep), manual dispatch.
# Secrets: none beyond the ambient GITHUB_TOKEN.
name: fetch
on:
  push:
    paths: ["data/requests.json"]
  schedule:
    - cron: "30 21 * * 1-5"   # weekdays after US close (UTC)
  workflow_dispatch: {}

concurrency:
  group: fetch
  # A running job is NEVER cancelled by a newer event in this group -- the 2026-09-14
  # deadlock was the 30-minute job timeout killing runs before their commit step, and
  # cancellation-by-concurrency would be the same failure by a different cause. With
  # cancel-in-progress false, an event that arrives while a run is IN PROGRESS simply
  # QUEUES; if more than one is queued at once (a push landing while fetch.py's own
  # self-dispatch, below, is also queued), GitHub keeps only the most recently queued
  # run and cancels the earlier one(s) still WAITING -- that cancellation can only ever
  # hit a run that has not started, never the one currently executing.
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  actions: write   # lets the fetch step below dispatch its own successor run

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned exactly: the data plane must not change behaviour because an upstream
      # maintainer shipped a release. A version bump here is its own commit.
      # edgartools    -> Form 4 / XBRL (docs/analyst-sources.md)
      # financetoolkit-> Piotroski / Beneish / Altman formulas (tools/acis/quality.py)
      - name: install deps
        run: |
          pip install --quiet requests pandas yfinance pytrends \
            "edgartools==5.53.0" "financetoolkit==2.2.0"
          python3 -c "import edgar, financetoolkit; from financetoolkit.models import piotroski_model, beneish_model, altman_model; print('analyst deps import OK')"
      - name: fetch
        env:
          # Self-chaining (BUILD 2026-09-14): a request-row backlog too big for one
          # 30-minute job (673 PENDING rows landed at once, pcs throttled, web_doc
          # alone carries a 45s-per-request ceiling) now drains itself. When a run
          # finishes with PENDING rows still queued and made real progress this run,
          # tools/fetch/fetch.py dispatches the next run of this same workflow via
          # `gh workflow run` instead of waiting for the next weekday cron. GitHub
          # deliberately does not let a push made with GITHUB_TOKEN (the commit step
          # below) retrigger this workflow's own `push:` trigger -- that recursion
          # guard is what left 673 rows sitting idle with no push to wake a new run --
          # so this explicit workflow_dispatch call is the only thing that actually
          # chains runs. GH_TOKEN here is what lets `gh` authenticate as this job;
          # `actions: write` above is what lets that token dispatch a workflow.
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/fetch/fetch.py
      # Best-effort, never a gate on the data commit. app/build.py runs validate.py first
      # and validate examines session-written profiles: from 2026-09-02 a profile whose NULL
      # basis says "market file missing" FAILS the moment the fetcher puts that file on disk.
      # Six consecutive runs (2026-09-02 17:50Z to 2026-09-04 01:34Z) fetched correctly,
      # failed here, and never reached the commit step, so every fetched file was discarded
      # and 46 request rows sat PENDING while the data they asked for was thrown away on the
      # runner. Fetched public data lands regardless; a stale page is the session's problem.
      - name: rebuild UI (best effort)
        continue-on-error: true
        run: python3 app/build.py
      - name: commit (race-safe)
        run: |
          git config user.name upstream-bot
          git config user.email actions@users.noreply.github.com
          git add data app/index.html
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "[fetch] $(date -u +%F) ${GITHUB_EVENT_NAME}"
          for i in 1 2 3; do
            git push && exit 0
            echo "push attempt $i failed, rebasing"
            # Conflict recovery used to know exactly one path (app/index.html); a peer's
            # concurrent EDGAR push left markers in ~29 data files, validate counted 61
            # errors, and run 33457972947 discarded a successful 385-item feed batch.
            # tools/resolve_conflicts.py holds the per-file-class rules as code (ledger
            # UNION via .gitattributes, requests union-by-id, fetcher stores
            # newest-fetched, index.html either-side-then-rebuild) and refuses, loudly,
            # any path it has no rule for.
            git pull --rebase || python3 tools/resolve_conflicts.py --continue-rebase --rebuild
            sleep $((i * 7))
          done
          exit 1
      - name: indicator trip issue
        if: ${{ hashFiles('trips.txt') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "INDICATOR TRIPPED $(date -u +%F)" \
            --body "$(cat trips.txt)

          A scenario leading indicator crossed its level. Open the chain in the Upstream UI and decide whether the scenario advances.
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: loud failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "fetch FAILED $(date -u +%F)" \
            --body "The fetch workflow failed; data may be stale and stages will show PENDING_DATA until it is fixed.
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
